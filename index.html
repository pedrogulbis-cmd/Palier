function sheetRemplacer(sh){
  const orig = EXOS[sh.e];
  if(!orig) return "";
  const actuel = resoudre(sh.e);
  const alts = alternatives(sh.e);
  let h = '<div class="sheet">' + hautPanneau("Remplacer", "retour-exo");
  h += '<div class="sheet-in">';
  h += '<section class="total" style="padding:20px 0 14px">' +
    '<div class="total-lbl">À la place de</div>' +
    '<span class="total-val num" style="font-size:clamp(24px,7vw,30px)">' + esc(orig.n) + '</span>' +
    '<div class="total-sub"><span>' + esc(GROUPES[orig.g]) + '</span><span>' + esc(PATS[orig.pat]) + '</span>' +
      '<span>' + esc(MATOS[DB.settings.matos||0]) + '</span></div></section>';
  h += '<div class="aide" style="margin-top:12px">Seuls les exercices travaillant les mêmes muscles sont proposés, et seulement ceux que ton matériel permet. Le matériel se règle dans les réglages.</div>';

  if(actuel !== sh.e){
    h += '<div class="btns grow" style="margin-top:14px"><button class="btn" data-act="retablir-exo" data-id="' + sh.e + '">' +
      svg("echange",16) + 'Rétablir ' + esc(orig.n) + '</button></div>';
  }

  h += '<div class="sect"><h2>Les remplaçants possibles</h2><div class="sp"></div><span class="cnt">' + alts.length + '</span></div>';
  h += '<div class="ops">';
  if(!alts.length){
    h += '<div class="vide"><b>Aucun remplaçant</b>Élargis le matériel disponible dans les réglages pour ouvrir le choix.</div>';
  }
  alts.forEach(k => {
    const x = EXOS[k];
    const meme = x.pat === orig.pat;
    h += '<div class="exo' + (k === actuel ? " done" : "") + '">' +
      '<button class="exo-f" data-act="appliquer-remplacement" data-id="' + sh.e + '" data-par="' + k + '" aria-label="' + esc(x.n) + '">' + figSVG(x.fig) + '</button>' +
      '<button class="exo-mid" style="text-align:left" data-act="appliquer-remplacement" data-id="' + sh.e + '" data-par="' + k + '">' +
        '<span class="exo-n">' + esc(x.n) + (k === actuel ? '<span class="badge acc">en place</span>' : "") + '</span>' +
        '<span class="exo-s">' + esc(GROUPES[x.g]) + ' · ' + esc(meme ? PATS[x.pat] : "muscles proches") +
          (x.mat ? ' · ' + esc(MATOS[x.mat]) : "") + '</span></button>' +
      '<span class="sea-go">' + svg("chev",16) + '</span></div>';
  });
  h += '</div></div></div>';
  return h;
}

/* Les repas déjà saisis servent de raccourcis : on mange rarement des choses
   entièrement nouvelles, et retaper « petit-déjeuner » chaque matin serait
   une punition. */
function favoris(){
  const m = new Map();
  joursAll().forEach(j => (j.repas||[]).forEach(r => {
    const k = (r.n||"").trim().toLowerCase();
    if(!k) return;
    const g = m.get(k) || { n:r.n, k:r.k, nb:0, t:0 };
    g.nb++;
    if((r.t||0) > g.t){ g.t = r.t; g.k = r.k; }
    m.set(k, g);
  }));
  return [...m.values()].sort((a,b) => b.nb - a.nb || b.t - a.t).slice(0, 6);
}

      '<div class="btns" style="margin:14px 0 0"><button class="btn" style="flex:1" data-act="fermer-modal">Fermer</button></div>';
  }

  if(m.type === "prolonger"){
    const P = DB.prog;
    c = '<h3>Prolonger le programme</h3>' +
      '<div class="sous">Les semaines ajoutées reprennent la progression là où elle s\'arrête : les blocs continuent de monter, avec une semaine allégée sur quatre.</div>' +
      '<div class="lig" style="border:0"><div class="l">Actuellement<div class="d">' + P.sem + ' semaines, dont ' +
        Math.ceil(P.sem/4) + ' blocs</div></div></div>' +
      [4,12,26].filter(n => P.sem + n <= 52).map(n =>
        '<button class="bascule" data-act="prolonger-ok" data-id="' + n + '">' +
        '<span class="l">+ ' + n + ' semaines<span class="d">Jusqu\'à la semaine ' + (P.sem + n) + '</span></span>' +
        '<span class="k"></span></button>').join("") +
      (P.sem >= 52 ? '<div class="aide">Le programme atteint déjà une année complète. Au-delà, mieux vaut en choisir un autre : changer de programme est en soi une forme de progression.</div>' : "") +
      '<div class="btns" style="margin:14px 0 0"><button class="btn" style="flex:1" data-act="fermer-modal">Fermer</button></div>';
  }

  if(m.type === "confirm"){
    c = '<h3>' + esc(m.titre) + '</h3><div class="sous">' + esc(m.texte) + '</div>' +
      '<div class="btns" style="margin:18px 0 0"><button class="btn" style="flex:0 0 auto" data-act="fermer-modal">Renoncer</button>' +
      '<button class="btn ' + (m.dang ? "dang" : "pri") + '" style="flex:1" data-act="' + m.ok + '" data-id="' + esc(m.id||"") + '">' +
      esc(m.valider) + '</button></div>';
  }

  if(m.type === "effacer"){
    c = '<h3>Tout effacer</h3>' +
      '<div class="sous">Journées, pesées, séances, objectif et programme. Rien ne pourra être récupéré.</div>' +
      '<div class="champ"><label for="m-conf">Tape EFFACER pour confirmer</label>' +
        '<input type="text" id="m-conf" autocomplete="off" placeholder="EFFACER"></div>' +
      '<div class="btns" style="margin:18px 0 0"><button class="btn" style="flex:0 0 auto" data-act="fermer-modal">Renoncer</button>' +
      '<button class="btn dang" style="flex:1" data-act="effacer-ok">Tout effacer</button></div>';
  }

  return '<div class="mdl-bg" data-act="fermer-modal"><div class="mdl" data-act="rien">' + c + '</div></div>';
}

/* L'aperçu du plan, recalculé à chaque frappe sans redessiner la fenêtre :
   redessiner fermerait le clavier au premier chiffre tapé. */
function majApercu(){
  const el = document.getElementById("m-apercu");
  if(!el || !state.modal || state.modal.type !== "objectif") return;
  const g = i => { const e = document.getElementById(i); return e ? e.value : ""; };
  const depart = grammes(g("m-depart")), cible = grammes(g("m-cible"));
  const mois = parseInt(g("m-mois"), 10) || 3;
  const prof = { sexe:state.modal.sexe, age:parseInt(g("m-age"),10) || 35,
                 taille:parseInt(g("m-taille"),10) || 175, activite:g("m-activite") || "sedentaire" };
  if(!depart || !cible){
    el.innerHTML = '<div class="aide" style="margin-top:14px">Renseigne un poids de départ et un poids visé pour voir le plan.</div>';
    return;
  }
  const total = Math.max(7, Math.round(mois * 30.44));
  const dep = tdeeDe(depart, prof), pl = plancherDe(depart, prof), plaf = dep + 700;
  const brute = Math.round(dep - ((depart - cible)/1000 * KCAL_PAR_KG) / total);
  const base = clamp(brute, pl, plaf);
  const rythme = ((dep - base) * 7) / KCAL_PAR_KG;
  const sens = depart - cible > 200 ? "perte" : (depart - cible < -200 ? "prise" : "maintien");
  let h = '<div class="bloc" style="margin-top:16px"><div class="bloc-b">' +
    '<div class="lig"><div class="l">Calories par jour<div class="d">Dépense estimée ' + kcal(dep) + ' kcal</div></div>' +
      '<span class="mono" style="font-size:16px;font-weight:500">' + kcal(base) + '</span></div>' +
    '<div class="lig"><div class="l">Rythme<div class="d">' +
      (sens === "maintien" ? "Maintien du poids" :
        esc(kg(Math.round(Math.abs(rythme)*1000))) + ' kg ' + (sens === "perte" ? "perdus" : "pris") + ' par semaine') +
      '</div></div><span class="mono">' + kgSigne(cible - depart) + ' kg</span></div>' +
    '<div class="lig"><div class="l">Fin du plan<div class="d">' + total + ' jours</div></div>' +
      '<span class="mono">' + esc(frDate(plusJours(todayISO(), total), true)) + '</span></div></div></div>';
  if(base - brute > 50)
    h += '<div class="avert">Ce délai demanderait ' + kcal(brute) + ' kcal par jour, sous le plancher de ' + kcal(pl) +
         '. Le plan s\'y tiendra, mais l\'objectif arrivera plus tard que prévu — mieux vaut allonger la durée.</div>';
  else if(brute - base > 50)
    h += '<div class="avert">Ce délai demanderait ' + kcal(brute) + ' kcal par jour. Au-delà de ' + kcal(plaf) +
         ', le surplus part en graisse plus qu\'en muscle : le plan plafonne là et la prise sera plus lente.</div>';
  else if(rythme > 1)
    h += '<div class="avert">Plus d\'un kilo perdu par semaine : tenable quelques semaines, rarement au-delà.</div>';
  else if(rythme < -0.5)
    h += '<div class="avert">Plus de 500 g pris par semaine, c\'est surtout de la graisse. Une prise de muscle honnête va de 250 à 500 g par semaine.</div>';
  el.innerHTML = h;
}

/* ============================================================
   ACTIONS
   ============================================================ */
function ouvrirModal(m){ state.modal = m; render(); }
function fermerModal(){ state.modal = null; render(); }
function ouvrirSheet(s){ state.sheet = s; render(); }

/* Basculer un interrupteur redessine la fenêtre : sans relever les champs
   avant, un poids à moitié saisi disparaîtrait au moindre changement. */
const CHAMPS = { "m-depart":"depart", "m-cible":"cible", "m-mois":"mois", "m-age":"age",
  "m-obj":"obj", "m-sem":"semaines",
  "m-taille":"taille", "m-activite":"activite", "m-debut":"debut", "m-nom":"nom",
  "m-kcal":"kcal", "m-poids":"poids", "m-tour":"tour", "m-date":"date" };
function capturerModal(){
  const m = state.modal;
  if(!m) return;
  Object.keys(CHAMPS).forEach(id => {
    const e = document.getElementById(id);
    if(e) m[CHAMPS[id]] = e.value;
  });
}
function val(id){ const e = document.getElementById(id); return e ? e.value : ""; }
function restaurerPaquet(paq){
  (paq.jours||[]).forEach(j => { DB.jours[j.id] = j; sauverJour(j); });
}

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act === "rien"){ ev.stopPropagation(); return; }

  /* ---- navigation ---- */
  if(act === "tab"){ state.tab = id; state.sheet = null; render(); window.scrollTo(0,0); return; }
  if(act === "fermer-sheet"){ state.sheet = null; render(); return; }
  if(act === "fermer-modal"){ fermerModal(); return; }
  if(act === "retour-seance"){ ouvrirSheet({ type:"seance", id:state.sheet.sid }); return; }
  if(act === "retour-exo"){
    ouvrirSheet({ type:"exo", e:state.sheet.e, sid:state.sheet.sid || null, i:state.sheet.i });
    return;
  }
  if(act === "basculer-journal"){ state.journal = !state.journal; state.neuf = false; DB.meta.vue = VERSION; sauver(true); render(); return; }
  if(act === "journal-ouvrir"){
    state.tab = "reglages"; state.journal = true; state.neuf = false;
    DB.meta.vue = VERSION; sauver(true); render(); window.scrollTo(0,0); return;
  }
  if(act === "basculer-passe"){ state.passe = !state.passe; render(); return; }
  if(act === "b-periode"){ state.bPeriode = id; DB.settings.bTri = id; sauver(true); render(); return; }
  /* Le « plus » du bandeau, qui n'ajoute pas la même chose selon l'onglet. */
  if(act === "plus"){
    if(state.tab === "sport"){ ouvrirChoixProgramme(); return; }
    if(state.tab === "poids"){ if(!DB.plan) ouvrirObjectif(false); else ouvrirPesee(null); return; }
    ouvrirRepas(null); return;
  }

  /* ---- objectif ---- */
  if(act === "nouvel-objectif"){ ouvrirObjectif(false); return; }
  if(act === "modifier-objectif"){ ouvrirObjectif(true); return; }
  if(act === "m-sexe"){ capturerModal(); state.modal.sexe = id; render(); return; }
  if(act === "objectif-ok"){
    capturerModal();
    const m = state.modal;
    const depart = grammes(m.depart), cible = grammes(m.cible);
    const mois = parseInt(m.mois, 10) || 3;
    if(!depart){ toast("Il manque le poids de départ"); return; }
    if(!cible){ toast("Il manque le poids visé"); return; }
    if(cible < 25000 || cible > 400000){ toast("Ce poids visé semble erroné"); return; }
    if(Math.abs(cible - depart) > 60000){ toast("L'écart entre les deux poids est irréaliste"); return; }
    if(depart < 30000 || depart > 400000){ toast("Ce poids de départ semble erroné"); return; }
    DB.settings.sexe = m.sexe === "f" ? "f" : "h";
    DB.settings.age = clamp(parseInt(m.age,10) || 35, 14, 100);
    DB.settings.taille = clamp(parseInt(m.taille,10) || 175, 120, 230);
    DB.settings.activite = m.activite || "sedentaire";
    const debut = (m.debut || "").trim() || (DB.plan ? DB.plan.debut : todayISO());
    DB.plan = { debut, depart, cible, mois, cree:(DB.plan && DB.plan.cree) || Date.now() };
    /* La première pesée du plan, si elle manque, c'est le poids de départ. */
    if(!pesees().length){ const j = jour(debut); j.poids = depart; sauverJour(j); }
    sauver(); fermerModal();
    state.tab = "poids"; render(); window.scrollTo(0,0);
    toast("Plan créé : " + kcal(planCalc().base) + " kcal par jour");
    return;
  }
  if(act === "retirer-objectif"){
    ouvrirModal({ type:"confirm", titre:"Retirer l'objectif", valider:"Retirer", ok:"retirer-objectif-ok", dang:true,
      texte:"Le plafond de calories disparaît. Les pesées, les repas et les séances sont conservés." });
    return;
  }
  if(act === "retirer-objectif-ok"){ DB.plan = null; sauver(); fermerModal(); toast("Objectif retiré"); return; }

  /* ---- repas ---- */
  if(act === "nouveau-repas"){ ouvrirRepas(null); return; }
  if(act === "modifier-repas"){
    const j = jourLu(todayISO());
    const r = j && (j.repas||[]).filter(x => x.i === id)[0];
    if(r) ouvrirModal({ type:"repas", id:r.i, nom:r.n, kcal:String(r.k), date:todayISO(), focus:"m-kcal" });
    return;
  }
  if(act === "repas-favori"){
    const k = el.dataset.k;
    const cn = document.getElementById("m-nom"), ck = document.getElementById("m-kcal");
    if(cn) cn.value = id;
    if(ck) ck.value = k;
    return;
  }
  if(act === "repas-creer" || act === "repas-modifier"){
    capturerModal();
    const m = state.modal;
    const k = Math.round(parseFloat(String(m.kcal||"").replace(",",".")) || 0);
    if(k <= 0){ toast("Il manque les calories"); const c = $("#m-kcal"); if(c) c.focus(); return; }
    const j = jour(m.date || todayISO());
    if(act === "repas-creer"){
      j.repas.push({ i:uid(), n:(m.nom||"").trim() || "Repas", k, t:Date.now() });
    }else{
      const r = j.repas.filter(x => x.i === m.id)[0];
      if(r){ r.k = k; r.n = (m.nom||"").trim() || "Repas"; }
    }
    sauverJour(j); fermerModal();
    toast(act === "repas-creer" ? "Repas ajouté" : "Repas modifié");
    return;
  }
  if(act === "repas-supprimer"){
    const m = state.modal;
    const j = jour(m.date || todayISO());
    corbeille = { jours:[JSON.parse(JSON.stringify(j))] };
    j.repas = j.repas.filter(x => x.i !== id);
    sauverJour(j); fermerModal();
    toast("Repas supprimé", "annuler-suppr");
    return;
  }
  if(act === "objectif-tenu"){
    const t = todayISO();
    const c = planCalc();
    if(!c){ toast("Aucun objectif défini"); return; }
    const reste = objectifJour(t) - kcalJour(t);
    if(reste <= 0){ toast("L'objectif du jour est déjà atteint"); return; }
    const j = jour(t);
    j.repas.push({ i:uid(), n:"Reste de la journée", k:reste, t:Date.now() });
    sauverJour(j); render();
    toast(kcal(reste) + " kcal ajoutées pour boucler la journée");
    return;
  }
  if(act === "annuler-suppr"){
    if(corbeille){ restaurerPaquet(corbeille); corbeille = null; toast("Restauré"); render(); }
    fermerToast(); return;
  }

  /* ---- pesées ---- */
  if(act === "nouvelle-pesee"){ ouvrirPesee(null); return; }
  if(act === "modifier-pesee"){ ouvrirPesee(id); return; }
  if(act === "pesee-ok"){
    capturerModal();
    const m = state.modal;
    const p = grammes(m.poids);
    if(!p){ toast("Il manque le poids"); return; }
    if(p < 25000 || p > 400000){ toast("Ce poids semble erroné"); return; }
    const d = (m.date || todayISO()).trim() || todayISO();
    /* Changer la date d'une pesée, c'est la déplacer : l'ancienne journée
       perd son poids, la nouvelle le reçoit. */
    if(m.edit && m.origine && m.origine !== d){
      const anc = jourLu(m.origine);
      if(anc){ anc.poids = 0; anc.tour = 0; sauverJour(anc); }
    }
    const j = jour(d);
    j.poids = p;
    j.tour = clamp(parseInt(m.tour,10) || 0, 0, 300);
    sauverJour(j); fermerModal();
    toast("Pesée enregistrée");
    return;
  }
  if(act === "pesee-supprimer"){
    const j = jourLu(id);
    if(j){
      corbeille = { jours:[JSON.parse(JSON.stringify(j))] };
      j.poids = 0; j.tour = 0; sauverJour(j);
    }
    fermerModal();
    toast("Pesée supprimée", "annuler-suppr");
    return;
  }

  /* ---- eau ---- */
  if(act === "eau"){
    const j = jour(todayISO());
    j.eau = clamp((j.eau||0) + parseInt(id,10), 0, 30);
    sauverJour(j); render();
    return;
  }
  if(act === "eau-cible"){
    DB.settings.eauCible = clamp((DB.settings.eauCible||8) + parseInt(id,10), 1, 20);
    sauver(true); render(); return;
  }

  /* ---- programme ---- */
  if(act === "choisir-programme" || act === "changer-programme"){ ouvrirChoixProgramme(); return; }
  if(act === "choisir-zone"){ ouvrirChoixProgramme(id); return; }
  if(act === "f-zone"){ state.fZone = id; render(); return; }
  if(act === "f-mat"){ state.fMat = id === "tout" ? null : parseInt(id,10); render(); return; }
  if(act === "config-programme"){
    const p = prog(id);
    if(!p) return;
    const defaut = [[1,4],[1,3,5],[1,2,4,6],[1,2,4,5],[1,2,3,4,5]][clamp(p.par,1,5)-1] || [1,3,5];
    ouvrirModal({ type:"programme", id:p.id, jours:defaut.slice(), debut:todayISO(),
                  obj:DB.settings.objectif || "forme", semaines:p.sem, remplace:!!DB.prog });
    return;
  }
  if(act === "m-jour"){
    capturerModal();
    const j = parseInt(id,10);
    const l = state.modal.jours || [];
    const i = l.indexOf(j);
    if(i === -1) l.push(j); else l.splice(i,1);
    state.modal.jours = l;
    render();
    return;
  }
  if(act === "programme-ok"){
    capturerModal();
    const m = state.modal;
    if(!m.jours || !m.jours.length){ toast("Choisis au moins un jour"); return; }
    const debut = (m.debut || "").trim() || todayISO();
    if(DB.prog) effacerProgramme();
    const n = genererSeances(m.id, debut, m.jours, m.semaines, m.obj || "forme");
    fermerModal();
    state.tab = "sport"; state.passe = false; state.sheet = null;
    render(); window.scrollTo(0,0);
    toast(n + " séances créées");
    return;
  }

  /* ---- séances ---- */
  if(act === "ouvrir-seance"){ ouvrirSheet({ type:"seance", id }); window.scrollTo(0,0); return; }
  if(act === "basculer-seance"){
    const s = DB.seances[id];
    if(!s) return;
    s.fait = !s.fait;
    s.faitLe = s.fait ? Date.now() : 0;
    if(s.fait && (!s.done || s.done.length !== s.b.length)) s.done = s.b.map((x,i) => i);
    if(!s.fait) s.done = [];
    sauverSeance(s);
    if(s.fait){ state.sheet = null; render(); toast("Séance terminée" + (DB.settings.crediterSport && DB.plan ? " · +" + kcal(s.k) + " kcal aujourd'hui" : "")); }
    else render();
    return;
  }
  if(act === "cocher-exo"){
    const s = DB.seances[id];
    if(!s) return;
    const i = parseInt(el.dataset.i, 10);
    s.done = s.done || [];
    const k = s.done.indexOf(i);
    if(k === -1) s.done.push(i); else s.done.splice(k,1);
    sauverSeance(s); render();
    return;
  }
  if(act === "ouvrir-exo"){
    ouvrirSheet({ type:"exo", e:id, sid:el.dataset.sid || null,
                  i:el.dataset.i === "" ? null : parseInt(el.dataset.i,10) });
    window.scrollTo(0,0);
    return;
  }
  if(act === "ouvrir-remplacer"){
    ouvrirSheet({ type:"remplacer", e:id, sid:el.dataset.sid || null,
                  i:el.dataset.i === "" ? null : parseInt(el.dataset.i,10) });
    window.scrollTo(0,0);
    return;
  }
  if(act === "appliquer-remplacement"){
    const par = el.dataset.par;
    remplacer(id, par);
    ouvrirSheet({ type:"exo", e:id, sid:state.sheet.sid, i:state.sheet.i });
    toast((EXOS[par]||{}).n + " remplace " + (EXOS[id]||{}).n + " partout");
    return;
  }
  if(act === "retablir-exo"){
    remplacer(id, null);
    if(state.sheet) ouvrirSheet({ type:"exo", e:id, sid:state.sheet.sid, i:state.sheet.i });
    else render();
    toast("Exercice d'origine rétabli");
    return;
  }
  if(act === "raz-subs"){
    DB.settings.subs = {}; sauver(); render();
    toast("Tous les exercices d'origine sont rétablis");
    return;
  }

  /* ---- profil et réglages ---- */
  if(act === "modifier-profil"){ ouvrirModal({ type:"profil", age:DB.settings.age, taille:DB.settings.taille, focus:"m-age" }); return; }
  if(act === "profil-ok"){
    DB.settings.age = clamp(parseInt(val("m-age"),10) || 35, 14, 100);
    DB.settings.taille = clamp(parseInt(val("m-taille"),10) || 175, 120, 230);
    sauver(); fermerModal(); toast("Profil enregistré");
    return;
  }
  if(act === "modifier-objent"){ ouvrirModal({ type:"objEnt" }); return; }
  if(act === "objent-ok"){
    const n = DB.prog ? regenererFutur(id) : (DB.settings.objectif = id, sauver(), 0);
    fermerModal();
    toast(objNom(id) + (n ? " · " + n + " séances à venir recalculées" : ""));
    return;
  }
  if(act === "prolonger"){ if(DB.prog) ouvrirModal({ type:"prolonger" }); return; }
  if(act === "prolonger-ok"){
    const n = prolongerProgramme(parseInt(id,10));
    fermerModal(); render();
    toast(n + " séances ajoutées · " + DB.prog.sem + " semaines au total");
    return;
  }
  if(act === "ouvrir-guide"){ ouvrirSheet({ type:"guide" }); window.scrollTo(0,0); return; }
  if(act === "modifier-activite"){ ouvrirModal({ type:"activite" }); return; }
  if(act === "activite-ok"){ DB.settings.activite = id; sauver(); fermerModal(); return; }
  if(act === "sexe"){ DB.settings.sexe = id; sauver(); render(); return; }
  if(act === "matos"){ DB.settings.matos = parseInt(id,10) || 0; sauver(); render(); return; }
  if(act === "bascule"){
    DB.settings[id] = !DB.settings[id];
    sauver(); render();
    return;
  }
  if(act === "theme"){
    ecritLS(LSTHEME, id); appliquerTheme(id);
    DB.settings.theme = id; sauver(true); majIcone(); render(); return;
  }
  if(act === "accent"){
    ecritLS(LSACC, id); appliquerAccent(id);
    DB.settings.accent = id; sauver(true); majIcone(); render(); return;
  }

  /* ---- données ---- */
  if(act === "exporter"){ exporterJSON(); return; }
  if(act === "importer"){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => { if(inp.files && inp.files[0]) importerFichier(inp.files[0]); };
    inp.click();
    return;
  }
  if(act === "effacer"){ ouvrirModal({ type:"effacer", focus:"m-conf" }); return; }
  if(act === "effacer-ok"){
    const v = (val("m-conf") || "").trim().toUpperCase();
    if(v !== "EFFACER"){ toast("Tape EFFACER pour confirmer"); return; }
    try{ await IDB.vider(); }catch(e){}
    DB = JSON.parse(JSON.stringify(DEFAULTS));
    DB.settings.theme = themeActuel(); DB.settings.accent = accentActuel();
    corbeille = null;
    state.sheet = null; state.tab = "jour";
    fermerModal();
    toast("Tout est effacé");
    return;
  }
});

function ouvrirObjectif(edit){
  const s = DB.settings, P = DB.plan;
  ouvrirModal({ type:"objectif", edit:!!edit,
    depart: P ? kg(P.depart) : (poidsActuel() ? kg(poidsActuel()) : ""),
    cible: P ? kg(P.cible) : "",
    mois: P ? P.mois : 3,
    debut: P ? P.debut : todayISO(),
    sexe: s.sexe, age: s.age, taille: s.taille, activite: s.activite });
}
function ouvrirRepas(){ ouvrirModal({ type:"repas", date:todayISO(), focus:"m-kcal" }); }
function ouvrirPesee(iso){
  const j = iso ? jourLu(iso) : null;
  ouvrirModal({ type:"pesee", edit:!!j, origine:iso || null,
    poids: j && j.poids ? kg(j.poids) : (poidsActuel() ? kg(poidsActuel()) : ""),
    tour: j && j.tour ? String(j.tour) : "",
    date: iso || todayISO(), focus:"m-poids" });
}
function ouvrirChoixProgramme(zone){
  state.tab = "sport";
  if(zone) state.fZone = zone;
  state.sheet = { type:"progs" };
  render(); window.scrollTo(0,0);
}

/* Les champs de l'objectif rafraîchissent l'aperçu sans redessiner. */
document.addEventListener("input", ev => {
  if(!state.modal || state.modal.type !== "objectif") return;
  if(!ev.target || !ev.target.id || ev.target.id.indexOf("m-") !== 0) return;
  majApercu();
});
document.addEventListener("change", ev => {
  if(!state.modal || !ev.target || !ev.target.id) return;
  if(state.modal.type === "objectif"){ majApercu(); return; }
  if(state.modal.type === "programme" && (ev.target.id === "m-obj" || ev.target.id === "m-sem")){
    capturerModal(); render();
  }
});

/* Entrée valide la modale ouverte, Échap referme ce qui est ouvert. */
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape"){
    if(state.modal){ fermerModal(); return; }
    if(state.sheet){ state.sheet = null; render(); return; }
  }
  if(ev.key !== "Enter" || !state.modal) return;
  const t = ev.target;
  if(t && t.tagName === "TEXTAREA") return;
  const b = document.querySelector('.mdl .btn.pri[data-act]');
  if(b && !b.disabled){ ev.preventDefault(); b.click(); }
});

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */
function contenuSauvegarde(){
  return JSON.stringify({ app:"palier", appVersion:VERSION, schema:SCHEMA,
    jours:DB.jours, seances:DB.seances, plan:DB.plan, prog:DB.prog,
    settings:DB.settings, meta:DB.meta }, null, 2);
}
function telecharger(nom, blob){
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function exporterJSON(){
  const d = new Date();
  const nom = "palier-" + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + ".json";
  telecharger(nom, new Blob([contenuSauvegarde()], { type:"application/json" }));
  DB.meta.exporte = Date.now(); sauver(true); render();
  toast("Sauvegarde exportée");
}
async function importerFichier(f){
  try{
    const x = JSON.parse(await f.text());
    const r = fusionnerSauvegarde(x);
    render();
    toast(r.nj + " journées et " + r.ns + " séances ajoutées");
  }catch(e){
    toast("Fichier illisible : " + ((e && e.message) || e));
  }
}

/* ============================================================
   ICÔNE ET MANIFESTE, PEINTS À LA COULEUR D'ACCENT
   ============================================================ */
function dessinerIcone(taille, marge){
  const c = document.createElement("canvas");
  c.width = c.height = taille;
  const x = c.getContext("2d");
  const acc = accentActuel();
  /* « maskable » : Android rogne l'icône en cercle ou en écusson selon le
     téléphone. On peint alors tout le carré et on garde le sigle au centre,
     à l'abri du rognage. Sinon, carré aux angles arrondis. */
  const p = marge ? taille * 0.12 : 0;
  const t = taille - p * 2, r = t * 0.22;
  x.fillStyle = acc;
  if(marge) x.fillRect(0, 0, taille, taille);
  else{
    x.beginPath();
    x.moveTo(r, 0); x.arcTo(t, 0, t, t, r); x.arcTo(t, t, 0, t, r);
    x.arcTo(0, t, 0, 0, r); x.arcTo(0, 0, t, 0, r); x.closePath();
    x.fill();
  }
  const u = t / 64, o = p;
  x.strokeStyle = surAccent(acc);
  x.lineCap = "round"; x.lineJoin = "round"; x.lineWidth = 5 * u;
  x.beginPath();
  x.moveTo(o + 12*u, o + 50*u);
  x.lineTo(o + 25*u, o + 50*u); x.lineTo(o + 25*u, o + 37*u);
  x.lineTo(o + 38*u, o + 37*u); x.lineTo(o + 38*u, o + 24*u);
  x.lineTo(o + 51*u, o + 24*u); x.lineTo(o + 51*u, o + 12*u);
  x.stroke();
  return c.toDataURL("image/png");
}
let _manifeste = null;
function majIcone(){
  try{
    const acc = accentActuel(), sur = surAccent(acc);
    const fav = document.getElementById("favicon");
    if(fav) fav.href = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
      '<rect width="64" height="64" rx="14" fill="' + acc + '"/>' +
      '<path d="M12 50h13V37h13V24h13V12" fill="none" stroke="' + sur + '" ' +
      'stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>');

    const p192 = dessinerIcone(192, false), p512 = dessinerIcone(512, false), pm = dessinerIcone(512, true);
    let at = document.querySelector('link[rel="apple-touch-icon"]');
    if(!at){ at = document.createElement("link"); at.rel = "apple-touch-icon"; document.head.appendChild(at); }
    at.href = p192;

    const man = {
      id:"palier", name:"Palier", short_name:"Palier", start_url:".", scope:".",
      display:"standalone", orientation:"portrait",
      background_color: themeActuel() === "sombre" ? "#0d0d10" : "#ffffff",
      theme_color: themeActuel() === "sombre" ? "#0d0d10" : "#ffffff",
      icons:[ { src:p192, sizes:"192x192", type:"image/png" },
              { src:p512, sizes:"512x512", type:"image/png" },
              { src:pm,  sizes:"512x512", type:"image/png", purpose:"maskable" } ]
    };
    if(_manifeste) URL.revokeObjectURL(_manifeste);
    _manifeste = URL.createObjectURL(new Blob([JSON.stringify(man)], { type:"application/manifest+json" }));
    let lm = document.querySelector('link[rel="manifest"]');
    if(!lm){ lm = document.createElement("link"); lm.rel = "manifest"; document.head.appendChild(lm); }
    lm.href = _manifeste;
  }catch(e){ /* une icône ratée ne doit pas empêcher l'application de tourner */ }
}

/* ---------- espace disque ---------- */
async function majQuota(){
  if(!navigator.storage || !navigator.storage.estimate) return;
  try{
    state.quota = await navigator.storage.estimate();
    if(pret && state.tab === "reglages") render();
  }catch(e){}
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
async function demarrer(){
  try{
    await IDB.ouvrir();
    DB = assembler(await IDB.tout());
  }catch(e){
    const vue = document.getElementById("view");
    if(vue) vue.innerHTML =
      '<div class="vide" style="margin-top:60px"><b>Stockage indisponible</b>' +
      esc(String((e && e.message) || e)) + '<br>La navigation privée de certains navigateurs interdit IndexedDB.</div>';
    return;
  }
  pret = true;

  if(!litLS(LSTHEME) && DB.settings.theme){ ecritLS(LSTHEME, DB.settings.theme); appliquerTheme(DB.settings.theme); }
  if(!litLS(LSACC) && DB.settings.accent){ ecritLS(LSACC, DB.settings.accent); appliquerAccent(DB.settings.accent); }
  DB.settings.theme = themeActuel();
  DB.settings.accent = accentActuel();
  state.bPeriode = DB.settings.bTri || "90j";

  state.neuf = DB.meta.vue !== VERSION;
  render();
  majIcone();
  majQuota();
}

/* Un téléphone rouvert le lendemain doit reclasser « aujourd'hui » et la
   séance du jour sans qu'on ait besoin de recharger la page. */
let _jour = todayISO();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible" || !pret) return;
  if(_jour !== todayISO()){ _jour = todayISO(); render(); }
});
window.addEventListener("pagehide", () => { ecouler(); });

demarrer();
</script>
