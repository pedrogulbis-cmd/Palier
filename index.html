  return Math.round(met * p * (minutes / 60));
}

/* ============================================================
   MODÈLE — LE PLAN DE CALORIES
   La dépense de repos vient de l'équation de Mifflin-St Jeor, la plus fiable
   des formules d'estimation. Elle reste une estimation : la balance, au bout
   de trois semaines, dit la vérité mieux qu'elle.
   ============================================================ */
const ACTIVITES = [
  ["sedentaire","Sédentaire",1.20,"Bureau, peu de marche. À choisir si le sport est compté à part."],
  ["leger","Légèrement actif",1.375,"Debout une partie de la journée, un peu de marche."],
  ["modere","Actif",1.55,"Métier physique, ou beaucoup de déplacements à pied."],
  ["intense","Très actif",1.725,"Travail de force, plusieurs heures d'effort par jour."]
];
function facteurActivite(){
  const a = ACTIVITES.filter(x => x[0] === DB.settings.activite)[0];
  return a ? a[2] : 1.2;
}
const KCAL_PAR_KG = 7700;   /* l'équivalent énergétique d'un kilo de masse grasse */

function bmrDe(poidsG, s){
  const p = (poidsG || 0) / 1000;
  if(!p) return 0;
  const base = 10*p + 6.25*(s.taille||175) - 5*(s.age||35);
  return Math.round(base + (s.sexe === "f" ? -161 : 5));
}
function facteurDe(s){
  const a = ACTIVITES.filter(x => x[0] === s.activite)[0];
  return a ? a[2] : 1.2;
}
/* La correction : le rapport entre ce que la formule prédit et ce que la
   balance a réellement constaté. Mifflin-St Jeor se trompe couramment de dix
   pour cent ; au bout de quelques semaines de données, on n'a plus besoin
   d'elle pour deviner. */
function tdeeDe(poidsG, s){
  return Math.round(bmrDe(poidsG, s) * facteurDe(s) * (s.corr || 1));
}
function plancherDe(poidsG, s){
  const mini = s.sexe === "f" ? 1200 : 1500;
  return Math.max(mini, Math.round(tdeeDe(poidsG, s) * 0.65));
}
function bmr(){ return bmrDe(poidsActuel(), DB.settings); }
function tdee(){ return tdeeDe(poidsActuel(), DB.settings); }
/* Le plancher : jamais moins de 1 500 kcal pour un homme, 1 200 pour une
   femme, et jamais moins des deux tiers de la dépense estimée. Un objectif
   trop ambitieux est rogné ici plutôt que d'être suivi. */
function plancher(){ return plancherDe(poidsActuel(), DB.settings); }

function planCalc(){
  const P = DB.plan;
  if(!P) return null;
  const total = Math.max(7, Math.round((P.mois || 3) * 30.44));
  const fin = plusJours(P.debut, total);
  const ecoule = clamp(ecart(P.debut, todayISO()), 0, total);
  const restants = Math.max(1, total - ecoule);
  /* Positif quand on veut perdre, négatif quand on veut prendre, nul en
     maintien : la même équation sert aux trois. */
  const deltaG = P.depart - P.cible;
  const deficitJour = ((deltaG / 1000) * KCAL_PAR_KG) / total;
  const dep = tdee();
  const pl = plancher();
  const plafond = dep + 700;                        /* un surplus au-delà se transforme en gras, pas en muscle */
  const brute = Math.round(dep - deficitJour);
  const base = clamp(brute, pl, plafond);
  const bride = Math.abs(base - brute) > 50;        /* l'objectif a été rogné, et pas de quelques calories */
  const rythme = ((dep - base) * 7) / KCAL_PAR_KG;  /* kilos par semaine visés, positif en perte */
  const sens = deltaG > 200 ? "perte" : (deltaG < -200 ? "prise" : "maintien");
  return { P, total, fin, ecoule, restants, deficitJour, dep, plancher:pl, plafond,
           brute, base, bride, rythme, sens, deltaG, perdreG:Math.max(0, deltaG) };
}
/* La dette : la somme des écarts des jours déjà renseignés. Un jour sans
   aucune saisie n'est pas compté comme un jeûne — il est simplement ignoré,
   sans quoi une journée oubliée offrirait un crédit qu'on n'a pas gagné. */
function dette(){
  const c = planCalc();
  if(!c) return { v:0, n:0 };
  let v = 0, n = 0;
  for(let i = 0; i < c.ecoule; i++){
    const d = plusJours(c.P.debut, i);
    if(!renseigne(d)) continue;
    v += kcalJour(d) - c.base;
    n++;
  }
  return { v:Math.round(v), n };
}
/* Ce que le sport rend à la journée : les séances du programme validées, et
   les activités notées à la main. Rien n'est crédité tant que la séance n'est
   pas cochée — une séance prévue n'est pas une séance faite. */
function seancesCreditees(iso){ return seancesDuJour(iso).filter(s => s.fait); }
function activitesJour(iso){ const j = jourLu(iso); return (j && j.sport) || []; }
function kcalSport(iso){
  return seancesCreditees(iso).reduce((t,s) => t + (s.k||0), 0) +
         activitesJour(iso).reduce((t,a) => t + (a.k||0), 0);
}
function creditSport(iso){
  if(!DB.settings.crediterSport) return 0;
  return kcalSport(iso);
}
/* L'objectif du jour : la base du plan, corrigée par la dette étalée sur les
   jours restants — au plus un cinquième dans un sens ou dans l'autre, pour
   qu'un dimanche de fête ne transforme pas la semaine en purge. */
function objectifJour(iso){
  const c = planCalc();
  if(!c) return 0;
  /* Une journée passée garde la cible qui était la sienne : le report des
     écarts se calcule à partir d'aujourd'hui, pas rétroactivement. */
  if(iso && iso < todayISO())
    return Math.round(clamp(c.base + creditSport(iso), c.plancher, Math.max(c.base + 300, c.dep + 500)));
  const d = dette();
  const marge = c.base * 0.2;
  const ajust = clamp(-d.v / c.restants, -marge, marge);
  const brut = c.base + ajust + creditSport(iso || todayISO());
  return Math.round(clamp(brut, c.plancher, Math.max(c.base + 300, c.dep + 500)));
}
function etatCal(consomme, cible){
  if(!cible) return null;
  const r = consomme / cible;
  if(r > 1.02) return "dang";
  if(r >= 0.9) return "att";
  return "ok";
}
const CL = { ok:"c-ok", att:"c-att", dang:"c-dang" };

/* La dépense observée, déduite des faits plutôt que d'une formule : ce qu'on
   a mangé en moyenne, plus ce que la balance a rendu ou pris. Trente jours de
   recul, deux pesées espacées d'au moins deux semaines, et une majorité de
   journées renseignées — en dessous, le calcul dirait n'importe quoi. */
function bilanEnergie(){
  const fin = todayISO();
  const l = pesees().filter(x => x.d >= plusJours(fin, -35));
  if(l.length < 2) return null;
  const a = l[0], b = l[l.length-1];
  const jours = ecart(a.d, b.d);
  if(jours < 14) return null;
  let n = 0, somme = 0;
  for(let i = 0; i <= jours; i++){
    const d = plusJours(a.d, i);
    if(!renseigne(d)) continue;
    n++; somme += kcalJour(d);
  }
  if(n < Math.round(jours * 0.6)) return { insuffisant:true, n, jours, requis:Math.round(jours*0.6) };
  const moy = somme / n;
  const varKcal = ((a.p - b.p) / 1000) * KCAL_PAR_KG;   /* positif si le poids a baissé */
  const obs = Math.round(moy + varKcal / jours);
  const est = tdee();
  return { obs, moy:Math.round(moy), jours, n, est, ecart:obs - est,
           corr:clamp((DB.settings.corr || 1) * (obs / Math.max(1, est)), 0.75, 1.30) };
}

/* Projection : le rythme réellement constaté sur les pesées des huit
   dernières semaines, extrapolé jusqu'au poids visé. Deux pesées suffisent
   à tracer une droite, pas à faire une prédiction : on le dit. */
function projection(){
  const l = pesees();
  if(l.length < 2 || !DB.plan) return null;
  const limite = plusJours(todayISO(), -56);
  const rec = l.filter(x => x.d >= limite);
  const s = rec.length >= 2 ? rec : l.slice(-2);
  const a = s[0], b = s[s.length-1];
  const j = Math.max(1, ecart(a.d, b.d));
  const parJour = (b.p - a.p) / j;               /* grammes par jour, négatif si l'on perd */
  const reste = DB.plan.cible - b.p;   /* positif s'il faut encore prendre, négatif s'il faut perdre */
  /* Moins de deux semaines entre la première et la dernière pesée : la pente
     mesure surtout l'eau et le contenu de l'estomac. Pas de date. */
  if(j < 14) return { parJour, semaine:parJour*7, date:null, n:s.length, court:true };
  /* Le poids doit bouger, et dans le bon sens. */
  if(Math.abs(parJour) < 1 || Math.abs(reste) < 200 || (reste > 0) !== (parJour > 0))
    return { parJour, semaine:parJour*7, date:null, n:s.length };
  const jours = Math.round(reste / parJour);
  return { parJour, semaine:parJour*7, date:plusJours(b.d, jours), jours, n:s.length };
}

/* ============================================================
   MODÈLE — LES SÉANCES
   ============================================================ */
const seancesAll = () => Object.values(DB.seances);
/* Les séances du programme en cours. Changer de programme n'efface pas les
   séances déjà validées : elles gardent leur identifiant de série, sortent de
   l'agenda et restent dans le bilan. */
function progs(){ return DB.progs || (DB.progs = []); }
function progParRun(run){ return progs().filter(p => p.run === run)[0] || null; }
function seancesRun(){
  const r = progs().map(p => p.run);
  return r.length ? seancesAll().filter(s => r.indexOf(s.run) !== -1) : [];
}
function seancesDeProg(run){ return seancesAll().filter(s => s.run === run); }
/* La semaine du programme telle qu'elle tombe aujourd'hui. */
function semaineDe(P){
  return Math.max(1, Math.min(P.sem,
    Math.floor(ecart(P.lundi || lundiDe(P.debut), todayISO()) / 7) + 1));
}
function seancesTri(){ return seancesRun().sort((a,b) => a.date === b.date ? a.mod - b.mod : (a.date < b.date ? -1 : 1)); }
function seancesDuJour(iso){ return seancesRun().filter(s => s.date === iso); }
function prochaineSeance(){
  const t = todayISO();
  const l = seancesTri().filter(s => s.date >= t && !s.fait);
  return l.length ? l[0] : null;
}
function seancesFaites(){ return seancesRun().filter(s => s.fait).length; }
function seancesPassees(){ const t = todayISO(); return seancesRun().filter(s => s.date <= t); }
function assiduite(){
  const p = seancesPassees();
  if(!p.length) return null;
  return Math.round(p.filter(s => s.fait).length / p.length * 100);
}

/* Génération : toutes les séances du programme sont créées d'un coup, posées
   sur les jours de semaine choisis. Les modèles tournent en boucle, si bien
   qu'une semaine à trois séances enchaîne A, B, C puis reprend à A. */
function poserSemaines(p, run, lundi, ordre, debut, w0, w1, objId, k){
  const ad = adaptations();
  let n = 0;
  for(let w = w0; w <= w1; w++){
    const base = plusJours(lundi, (w-1) * 7);
    ordre.forEach(jd => {
      const date = plusJours(base, (jd + 6) % 7);
      if(date < debut) return;
      const m = p.mod[k % p.mod.length];
      k++;
      const s = { id:uid(), prog:p.id, run, obj:objId, sem:w,
                  bloc:Math.floor((w-1)/4) + 1, deload:((w-1) % 4) === 3,
                  mod:p.mod.indexOf(m), date, n:m.n, k:m.k, min:p.min, fmt:m.f || "classique",
                  b:m.b.map(l => progresser(l, w, objId, ad)),
                  fait:false, faitLe:0, done:[] };
      DB.seances[s.id] = s;
      sale.seances.add(s.id);
      n++;
    });
  }
  return n;
}
function genererSeances(progId, debut, joursSem, semaines, objId, remplacer){
  const p = prog(progId);
  if(!p || !joursSem.length) return 0;
  if(remplacer) progs().slice().forEach(x => retirerProgramme(x.run));
  const sem = clamp(parseInt(semaines,10) || p.sem, 1, 52);
  const ordre = joursSem.slice().sort((a,b) => ((a+6)%7) - ((b+6)%7));
  /* Un programme commencé un samedi ne doit pas perdre sa première semaine :
     si aucun des jours choisis ne tombe après la date de début, la semaine 1
     est celle d'après. */
  let lundi = lundiDe(debut);
  if(!ordre.some(jd => plusJours(lundi, (jd + 6) % 7) >= debut)) lundi = plusJours(lundi, 7);
  const run = uid();
  progs().push({ id:p.id, run, obj:objId, debut, lundi, jours:joursSem.slice(), sem, cree:Date.now() });
  const n = poserSemaines(p, run, lundi, ordre, debut, 1, sem, objId, 0);
  DB.settings.objectif = objId;
  sauver();
  return n;
}
/* Prolonger : la suite du même programme, avec les blocs qui continuent de
   monter là où ils s'étaient arrêtés. C'est ainsi qu'on tient une année. */
function prolongerProgramme(run, nb){
  const P = progParRun(run), p = P && prog(P.id);
  if(!p) return 0;
  const ordre = P.jours.slice().sort((a,b) => ((a+6)%7) - ((b+6)%7));
  const k = seancesDeProg(run).length;
  const n = poserSemaines(p, P.run, P.lundi, ordre, P.debut, P.sem + 1, P.sem + nb, P.obj, k);
  P.sem += nb;
  sauver();
  return n;
}
/* Changer d'objectif en cours de route ne touche pas au passé : seules les
   séances à venir sont recalculées, avec les nouvelles fourchettes. */
function regenererFutur(run, objId){
  const P = progParRun(run), p = P && prog(P.id);
  if(!p) return 0;
  const t = todayISO();
  const ad = adaptations();
  let n = 0;
  seancesDeProg(run).forEach(s => {
    if(s.fait || s.date < t) return;
    const m = p.mod[s.mod % p.mod.length];
    s.obj = objId;
    s.fmt = m.f || "classique";
    s.b = m.b.map(l => progresser(l, s.sem, objId, ad));
    s.done = [];
    sauverSeance(s);
    n++;
  });
  P.obj = objId;
  DB.settings.objectif = objId;
  sauver();
  return n;
}
/* Recalculer tout ce qui est à venir, sur tous les programmes en cours. */
function regenererTout(){
  return progs().reduce((n,P) => n + regenererFutur(P.run, P.obj), 0);
}
/* Retirer un programme : les séances déjà validées restent au bilan, les
   autres disparaissent. */
function retirerProgramme(run){
  let n = 0;
  seancesDeProg(run).forEach(s => {
    if(s.fait) return;
    supprimerSeanceDB(s.id); n++;
  });
  DB.progs = progs().filter(p => p.run !== run);
  sauver();
  return n;
}

/* ---------- les charges soulevées ----------
   Une charge notée ne sert à rien si elle disparaît avec la séance : ce qui
   compte, c'est de savoir ce qu'on a soulevé la dernière fois. La mémoire est
   donc tenue par exercice, pas par séance. */
function chargeable(eid){
  const e = EXOS[eid];
  return !!e && e.g !== "cardio" && e.g !== "mobilite";
}
function derniereCharge(eid){ return (DB.charges || {})[eid] || null; }
function fmtKg(v){
  if(v == null) return "";
  return (Math.round(v * 2) / 2).toString().replace(".", ",") + " kg";
}
function noterCharge(eid, kg, reps){
  if(!DB.charges) DB.charges = {};
  const c = DB.charges[eid] || { hist:[] };
  c.kg = kg; c.x = reps || c.x || 0; c.ts = Date.now(); c.d = todayISO();
  c.hist = (c.hist || []).filter(h => h.d !== c.d);
  c.hist.push({ d:c.d, kg, x:c.x });
  if(c.hist.length > 12) c.hist = c.hist.slice(-12);
  DB.charges[eid] = c;
  sauver();
}

/* ---------- remplacements ----------
   Le remplacement est une correspondance globale, pas une retouche de séance :
   il vaut pour toutes les occurrences, passées et à venir, et se défait aussi
   simplement qu'il s'est posé. */
function resoudre(id){
  const s = DB.settings.subs || {};
  return s[id] && EXOS[s[id]] ? s[id] : id;
}
function estRemplace(id){ return resoudre(id) !== id; }
function alternatives(id){
  const e = EXOS[id];
  if(!e) return [];
  const dispo = DB.settings.matos || 0;
  const l = Object.keys(EXOS).filter(k => {
    if(k === id) return false;
    const x = EXOS[k];
    if(x.mat > dispo) return false;
    if(x.cor && !DB.settings.corde) return false;
    return x.pat === e.pat || x.g === e.g;
  });
  /* Même schéma d'abord, même muscle ensuite, puis par nom. */
  return l.sort((a,b) => {
    const A = EXOS[a], B = EXOS[b];
    const sa = (A.pat === e.pat ? 0 : 1) + (A.g === e.g ? 0 : 1);
    const sb = (B.pat === e.pat ? 0 : 1) + (B.g === e.g ? 0 : 1);
    if(sa !== sb) return sa - sb;
    return A.n.localeCompare(B.n, "fr");
  });
}
function remplacer(id, parId){
  if(!DB.settings.subs) DB.settings.subs = {};
  if(!parId || parId === id) delete DB.settings.subs[id];
  else DB.settings.subs[id] = parId;
  sauver();
}
function nbRemplacements(){ return Object.keys(DB.settings.subs || {}).length; }

/* ---------- petits graphiques ----------
   Tracés à la main en SVG : une bibliothèque de graphiques pèserait cent fois
   ce que pèsent ces deux fonctions. */
function graphLigne(pts, opt){
  const o = opt || {};
  const W = 320, H = 118, ml = 34, mr = 6, mt = 10, mb = 16;
  if(pts.length < 2) return '<div class="aide" style="text-align:center;padding:18px 0">Deux mesures suffiront à tracer la courbe.</div>';
  const vals = pts.map(p => p.v);
  if(o.cible != null) vals.push(o.cible);
  let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if(mx - mn < 0.6){ mx += 0.3; mn -= 0.3; }
  const pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
  const x = i => ml + (i / (pts.length - 1)) * (W - ml - mr);
  const y = v => mt + (1 - (v - mn) / (mx - mn)) * (H - mt - mb);
  const d = pts.map((p,i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const aire = d + " L" + x(pts.length-1).toFixed(1) + " " + (H-mb) + " L" + ml + " " + (H-mb) + " Z";
  let h = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
  h += '<path d="' + aire + '" fill="var(--accF)"/>';
  if(o.cible != null && o.cible >= mn && o.cible <= mx)
    h += '<line x1="' + ml + '" x2="' + (W-mr) + '" y1="' + y(o.cible).toFixed(1) + '" y2="' + y(o.cible).toFixed(1) +
         '" stroke="var(--ok)" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>';
  h += '<path d="' + d + '" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  h += '<circle cx="' + x(pts.length-1).toFixed(1) + '" cy="' + y(pts[pts.length-1].v).toFixed(1) + '" r="3.4" fill="var(--acc)"/>';
  h += '<text class="gx" x="2" y="' + (mt+4) + '">' + esc(o.fmt ? o.fmt(mx) : mx.toFixed(1)) + '</text>';
  h += '<text class="gx" x="2" y="' + (H-mb+4) + '">' + esc(o.fmt ? o.fmt(mn) : mn.toFixed(1)) + '</text>';
  h += '<text class="gx" x="' + ml + '" y="' + (H-3) + '">' + esc(frDate(pts[0].d)) + '</text>';
  h += '<text class="gx" x="' + (W-mr) + '" y="' + (H-3) + '" text-anchor="end">' + esc(frDate(pts[pts.length-1].d)) + '</text>';
  return h + '</svg>';
}
function graphBarres(items, cible){
  const W = 320, H = 108, mt = 8, mb = 16, ml = 4, mr = 4;
  if(!items.length) return '<div class="aide" style="text-align:center;padding:18px 0">Aucune journée renseignée.</div>';
  const mx = Math.max(cible || 0, Math.max.apply(null, items.map(i => i.v))) * 1.12 || 1;
  const n = items.length;
  const bw = (W - ml - mr) / n;
  const y = v => mt + (1 - v / mx) * (H - mt - mb);
  let h = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:108px">';
  items.forEach((it,i) => {
    const hh = Math.max(1, (H - mb) - y(it.v));
    const col = it.v === 0 ? "var(--trait)" : (it.v > (it.c || cible) ? "var(--dang)" : "var(--acc)");
    h += '<rect x="' + (ml + i*bw + bw*0.14).toFixed(1) + '" y="' + y(it.v).toFixed(1) +
         '" width="' + (bw*0.72).toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="1" fill="' + col + '"/>';
  });
  if(cible) h += '<line x1="0" x2="' + W + '" y1="' + y(cible).toFixed(1) + '" y2="' + y(cible).toFixed(1) +
    '" stroke="var(--texte)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>';
  return h + '</svg>';
}

/* ============================================================
   ÉTAT DE L'INTERFACE
   ============================================================ */
const TABS = [
  { id:"jour",     l:"Aujourd'hui", i:"home" },
  { id:"poids",    l:"Poids",       i:"balance" },
  { id:"sport",    l:"Sport",       i:"halt" },
  { id:"bilan",    l:"Bilan",       i:"courbe" },
  { id:"reglages", l:"Réglages",    i:"cog" }
];
const state = { tab:"jour", sheet:null, modal:null, journal:false, neuf:false, quota:null,
                passe:false, ajout:false, fZone:"tout", fMat:null, bPeriode:"90j",
                q:"", fCat:null, panier:[], grouper:false, jourVu:null };

function render(){
  const v = $("#view");
  const anc = document.querySelector(".sheet");
  const posSheet = anc ? anc.scrollTop : 0;
  const posPage = window.scrollY;
  const h = v.offsetHeight;
  if(h) v.style.minHeight = h + "px";
  try{ dessiner(); }
  finally{ requestAnimationFrame(() => { v.style.minHeight = ""; }); }
  const neuf = document.querySelector(".sheet");
  if(neuf && posSheet) neuf.scrollTop = posSheet;
  if(window.scrollY !== posPage) window.scrollTo(0, posPage);
}

function dessiner(){
  /* Le champ de recherche se redessine à chaque touche : sans relever le
     focus et la position du curseur, le clavier se refermerait au premier
     caractère tapé. */
  const avant = document.activeElement;
  const fid = avant && avant.id ? avant.id : null;
  const curs = fid && avant.selectionStart != null ? avant.selectionStart : null;
  $("#tabs").innerHTML = TABS.map(t =>
    '<button class="tab ' + (state.tab === t.id ? "on" : "") + '" data-act="tab" data-id="' + t.id + '">' +
    svg(t.i, 20) + '<span>' + t.l + '</span></button>').join("");

  const chip = $("#ver-chip");
  if(chip){ chip.textContent = "v" + VERSION; chip.classList.toggle("neuf", state.neuf); }
  /* Le « plus » n'ajoute pas la même chose selon l'onglet : un repas, une
     pesée, un programme. Là où il n'a rien à ajouter, il disparaît. */
  const plus = $("#btn-plus");
  if(plus){
    const util = state.tab === "jour" || state.tab === "poids" || state.tab === "sport";
    plus.classList.toggle("hide", !util);
    plus.setAttribute("title", state.tab === "poids" ? "Nouvelle pesée" :
      (state.tab === "sport" ? "Choisir un programme" : "Ajouter un repas"));
  }

  const v = $("#view");
  if(state.tab === "jour")       v.innerHTML = vueJour();
  else if(state.tab === "poids") v.innerHTML = vuePoids();
  else if(state.tab === "sport") v.innerHTML = vueSport();
  else if(state.tab === "bilan") v.innerHTML = vueBilan();
  else                           v.innerHTML = vueReglages();

  $("#sheet").innerHTML = state.sheet ? vueSheet(state.sheet) : "";
  $("#modal").innerHTML = state.modal ? vueModal(state.modal) : "";
  if(state.modal && state.modal.type === "objectif") majApercu();

  const couvert = !!($("#sheet").firstChild || $("#modal").firstChild);
  document.body.style.overflow = couvert ? "hidden" : "";
  if(state.modal && state.modal.focus){
    const el = document.getElementById(state.modal.focus);
    if(el && document.activeElement !== el){ el.focus(); if(el.select) el.select(); }
  }else if(fid){
    const el = document.getElementById(fid);
    if(el && document.activeElement !== el){
      el.focus();
      if(curs != null && el.setSelectionRange){ try{ el.setSelectionRange(curs, curs); }catch(e){} }
    }
  }
}

/* ============================================================
   AUJOURD'HUI
   Une seule question en ouvrant l'application : qu'est-ce qu'il me reste à
   manger, et qu'est-ce que j'ai à faire aujourd'hui ?
   ============================================================ */
function carteSeance(s, compact){
  const t = todayISO();
  const etat = s.fait ? "fait" : (s.date === t ? "now" : (s.date < t ? "rate" : ""));
  const d = dObj(s.date);
  const sous = s.fait ? "Terminée " + relDate(s.date)
    : (s.date < t ? "Manquée · " + relDate(s.date)
    : (s.date === t ? s.b.length + " exercices · " + s.min + " min"
    : cap(relDate(s.date)) + " · " + s.min + " min"))
    + (s.deload && !s.fait ? " · allégée" : "")
    + (progs().length > 1 ? " · S" + s.sem : "");
  return '<button class="sea' + (s.fait ? " off" : "") + '" data-act="ouvrir-seance" data-id="' + s.id + '">' +
    '<span class="sea-d ' + etat + '">' +
      (s.fait ? svg("check",18,2.4) : '<span class="j">' + d.getDate() + '</span><span class="m">' + MOIS[d.getMonth()] + '</span>') +
    '</span>' +
    '<span class="sea-mid"><span class="sea-n">' + esc(s.n) + '</span>' +
      '<span class="sea-s">' + esc(sous) + (compact ? "" : ' · S' + s.sem) + '</span></span>' +
    '<span class="sea-go">' + svg("chev",18) + '</span></button>';
}

function vueJour(){
  const t = jourVu();
  const auj = t === todayISO();
  const c = planCalc();
  const conso = kcalJour(t);
  const j = jourLu(t);
  let h = "";

  /* La barre de jour : discrète quand on est aujourd'hui, teintée dès qu'on
     regarde en arrière, pour qu'on ne note jamais un repas sur le mauvais jour
     sans s'en apercevoir. */
  h += '<div class="jnav' + (auj ? "" : " hier") + '">' +
    '<button data-act="jour-prec" aria-label="Jour précédent">' + svg("fleche",17) + '</button>' +
    '<span class="d">' + esc(cap(relDate(t))) + '<b>' + esc(cap(JOURS[dObj(t).getDay()]) + " " + frDate(t, true)) + '</b></span>' +
    '<button data-act="jour-suiv" aria-label="Jour suivant"' + (auj ? " disabled" : "") + '>' + svg("chev",17) + '</button>' +
    '</div>';
  if(!auj) h += '<div class="aide" style="text-align:center;margin:8px 0 0">' +
    'Tu notes une journée passée. <button style="color:var(--acc);text-decoration:underline;text-underline-offset:3px" data-act="jour-auj">Revenir à aujourd\'hui</button></div>';

  if(!c){
    h += '<section class="total"><div class="total-lbl">Aucun objectif</div>' +
      '<span class="total-val num">Commencer</span>' +
      '<div class="total-sub"><span>Un poids de départ, un poids visé, un délai — et le compte des calories se règle tout seul.</span></div>' +
      '</section>' +
      '<div class="btns grow"><button class="btn pri" data-act="nouvel-objectif">' + svg("cible",16) +
      'Définir un objectif</button></div>';
  }else{
    const cible = objectifJour(t);
    const reste = cible - conso;
    const e = etatCal(conso, cible);
    h += '<section class="total">' +
      '<div class="total-lbl">' + (reste >= 0 ? (auj ? "Il reste aujourd'hui" : "Il restait ce jour-là") : "Objectif dépassé de") + '</div>' +
      '<span class="total-val num ' + (e ? CL[e] : "") + '">' + kcal(Math.abs(reste)) +
        '<span class="u">kcal</span></span>';
    const pc = Math.min(100, Math.round(conso / cible * 100));
    h += '<div class="bud"><div class="bud-l">' +
      '<span class="' + CL[e] + '">' + kcal(conso) + '</span><span>sur ' + kcal(cible) + ' kcal</span>' +
      '<span class="r">' + pc + ' %</span></div>' +
      '<div class="bud-b"><i class="' + e + '" style="width:' + pc + '%"></i></div></div>';
    const sub = [];
    const cs = creditSport(t);
    if(cs) sub.push('<span>dont <b class="c-ok">+' + kcal(cs) + '</b> rendus par le sport</span>');
    else if(kcalSport(t)) sub.push('<span><b>' + kcal(kcalSport(t)) + '</b> brûlés, non crédités</span>');
    const d = auj ? dette() : { n:0, v:0 };   /* le report ne concerne qu'aujourd'hui */
    if(d.n && Math.abs(d.v) > 60){
      const dj = Math.round(-d.v / c.restants);
      sub.push('<span>report des jours passés <b class="' + (dj < 0 ? "c-dang" : "c-ok") + '">' +
        (dj > 0 ? "+" : "−") + kcal(Math.abs(dj)) + '</b></span>');
    }
    sub.push('<span><b>J' + (c.ecoule + 1) + '</b> sur ' + c.total + '</span>');
    h += '<div class="total-sub">' + sub.join("") + '</div></section>';

    h += '<div class="btns grow">' +
      '<button class="btn pri" data-act="ouvrir-aliments">' + svg("plus",16,2) + 'J\'ai mangé</button>' +
      '<button class="btn" data-act="objectif-tenu">' + svg("check",16,2) + 'Journée conforme</button></div>';
  }

  /* ---- la séance ---- */
  const sj = seancesDuJour(t);
  const prochaine = prochaineSeance();
  if(sj.length || prochaine){
    const liste = sj.length ? sj : [prochaine];
    h += '<div class="sect"><h2>' + (sj.length ? "La séance du jour" : "Prochaine séance") + '</h2>' +
      '<div class="sp"></div><button class="lien" data-act="tab" data-id="sport">Tout voir</button></div>';
    h += '<div class="ops">' + liste.map(s => carteSeance(s, true)).join("") + '</div>';
  }else if(!progs().length){
    h += '<div class="sect"><h2>Le sport</h2></div>' +
      '<div class="ops"><div class="vide"><b>Aucun programme</b>' +
      'Choisis un programme et toutes les séances se posent sur ton agenda.</div></div>' +
      '<div class="btns grow"><button class="btn" data-act="choisir-programme">' + svg("halt",16) +
      'Choisir un programme</button></div>';
  }

  /* ---- le sport de la journée ----
     Les calories rendues par le sport ne doivent pas se deviner : on affiche
     ce qui a été fait, ce que ça rapporte, et ce qui reste à valider. */
  const brule = kcalSport(t);
  const seancesJ = seancesDuJour(t);
  const acts = activitesJour(t);
  const credite = DB.settings.crediterSport;
  h += '<div class="sect"><h2>Le sport du jour</h2><div class="sp"></div>' +
    (brule ? '<span class="cnt mono ' + (credite ? "c-ok" : "") + '">' +
      (credite ? "+" : "") + kcal(brule) + ' kcal</span>' : "") + '</div>';
  h += '<div class="ops">';
  if(!seancesJ.length && !acts.length){
    h += '<div class="vide"><b>Rien de noté</b>' +
      'Une marche, un match, deux heures de jardinage : tout ce qui fait dépenser peut être ajouté, et vient s\'ajouter à ta cible du jour.</div>';
  }
  seancesJ.forEach(s2 => {
    h += '<button class="op" data-act="ouvrir-seance" data-id="' + s2.id + '">' +
      '<span class="op-ic">' + svg("halt",15,1.8) + '</span>' +
      '<span class="op-mid"><span class="op-lib">' + esc(s2.n) + '</span>' +
      '<span class="op-met">' + (s2.fait ? "séance validée" : "séance prévue, pas encore validée") + '</span></span>' +
      '<span class="op-mt ' + (s2.fait ? "c-ok" : "c-gris") + '">' + (s2.fait ? "+" : "") + kcal(s2.k) + '</span></button>';
  });
  acts.forEach(a => {
    h += '<button class="op" data-act="suppr-activite" data-id="' + a.i + '">' +
      '<span class="op-ic">' + svg("feu",15,1.8) + '</span>' +
      '<span class="op-mid"><span class="op-lib">' + esc(a.n) + '</span>' +
      '<span class="op-met">' + a.m + ' min' + (a.t ? " · " + p2(new Date(a.t).getHours()) + ":" + p2(new Date(a.t).getMinutes()) : "") + '</span></span>' +
      '<span class="op-mt c-ok">+' + kcal(a.k) + '</span></button>';
  });
  h += '</div>';
  h += '<div class="btns grow"><button class="btn" data-act="ajouter-activite">' + svg("plus",16,2) +
    'Ajouter une activité</button></div>';
  if(brule){
    h += '<div class="aide">' + (credite
      ? 'Ces ' + kcal(brule) + ' kcal sont ajoutées à ta cible du jour : tu peux manger d\'autant plus sans creuser le plan.'
      : 'Le crédit du sport est désactivé dans les réglages : ces ' + kcal(brule) +
        ' kcal ne changent pas ta cible du jour. Elles restent comptées au bilan.') + '</div>';
  }

  /* ---- l'eau ---- */
  if(DB.settings.eau){
    const bu = (j && j.eau) || 0, ci = DB.settings.eauCible || 8;
    h += '<div class="sect"><h2>L\'eau</h2><div class="sp"></div>' +
      '<span class="cnt mono">' + bu + " / " + ci + ' verres</span></div>';
    h += '<div class="pas"><button data-act="eau" data-id="-1" aria-label="Retirer un verre">' + svg("moins",18,2) + '</button>' +
      '<div class="v">' + '💧'.repeat(Math.min(bu,12)) + (bu ? "" : '<span style="color:var(--gris2)">rien encore</span>') + '</div>' +
      '<button data-act="eau" data-id="1" aria-label="Ajouter un verre">' + svg("plus",18,2) + '</button></div>';
    h += '<div class="barre"><i style="width:' + Math.min(100, Math.round(bu/ci*100)) + '%"></i></div>';
  }

  /* ---- les repas ---- */
  h += '<div class="sect"><h2>' + (auj ? "Les repas d\'aujourd\'hui" : "Les repas du " + esc(frDate(t))) + '</h2><div class="sp"></div>' +
    (conso ? '<span class="cnt mono">' + kcal(conso) + ' kcal</span>' : "") + '</div>';
  const repas = (j && j.repas) ? j.repas.slice().sort((a,b) => (b.t||0) - (a.t||0)) : [];
  if(!repas.length){
    h += '<div class="ops"><div class="vide"><b>Rien de noté</b>' +
      'Touche « J\'ai mangé » et choisis tes plats dans le catalogue : les calories sont estimées pour toi.</div></div>';
  }else{
    h += '<div class="ops">' + repas.map(r =>
      '<button class="op" data-act="modifier-repas" data-id="' + r.i + '">' +
      '<span class="op-ic">' + svg("assiette",15,2) + '</span>' +
      '<span class="op-mid"><span class="op-lib">' + esc(r.n || "Repas") + '</span>' +
      '<span class="op-met">' + esc(r.t ? p2(new Date(r.t).getHours()) + ":" + p2(new Date(r.t).getMinutes()) : "") + '</span></span>' +
      '<span class="op-mt">' + kcal(r.k) + '</span></button>').join("") + '</div>';
  }

  /* ---- la pesée du jour ---- */
  const pj = j && j.poids;
  h += '<div class="sect"><h2>La pesée</h2></div>';
  h += '<div class="ops"><button class="op" data-act="nouvelle-pesee">' +
    '<span class="op-ic">' + svg("balance",15,1.8) + '</span>' +
    '<span class="op-mid"><span class="op-lib">' + (pj ? kg(pj) + " kg" : "Se peser") + '</span>' +
    '<span class="op-met">' + (pj ? "enregistré " + esc(relDate(t)) : "le matin, à jeun, c'est le plus fiable") + '</span></span>' +
    '<span class="sea-go">' + svg("chev",18) + '</span></button></div>';
  return h;
}

/* ============================================================
   POIDS
   ============================================================ */
function vuePoids(){
  const c = planCalc();
  if(!c){
    return '<section class="total"><div class="total-lbl">Perte de poids</div>' +
      '<span class="total-val num">Aucun plan</span>' +
      '<div class="total-sub"><span>Le poids de départ, le poids visé et le nombre de mois suffisent : le reste se calcule.</span></div></section>' +
      '<div class="btns grow"><button class="btn pri" data-act="nouvel-objectif">' + svg("cible",16) +
      'Définir un objectif</button></div>' +
      '<div class="ops"><div class="vide"><b>Comment ça marche</b>' +
      'La dépense quotidienne est estimée à partir du profil, le déficit est réparti sur la durée, et chaque écart de la veille se rattrape sur les jours restants.</div></div>';
  }
  const P = c.P, act = poidsActuel();
  const parcouru = act - P.depart, chemin = P.cible - P.depart;
  const bonSens = chemin === 0 ? true : (parcouru / chemin) >= 0;
  const pc = chemin === 0 ? 100 : clamp(Math.round(parcouru / chemin * 100), 0, 100);
  const prec = poidsPrecedent();

  let h = '<section class="total"><div class="total-lbl">Poids actuel</div>' +
    '<span class="total-val num">' + kg(act) + '<span class="u">kg</span></span>' +
    '<div class="bud"><div class="bud-l"><span>' + esc(kg(P.depart)) + ' kg au départ</span>' +
      '<span class="r">objectif ' + esc(kg(P.cible)) + ' kg</span></div>' +
      '<div class="bud-b"><i class="acc" style="width:' + pc + '%"></i></div></div>';
  const sub = [];
  sub.push('<span>depuis le départ <b class="' + (parcouru ? (bonSens ? "c-ok" : "c-dang") : "") + '">' +
    kgSigne(parcouru) + ' kg</b></span>');
  sub.push('<span>reste <b>' + kg(Math.abs(P.cible - act)) + ' kg</b></span>');
  if(prec){
    const d = act - prec;
    const ok = c.sens === "prise" ? d >= 0 : (c.sens === "perte" ? d <= 0 : Math.abs(d) < 500);
    sub.push('<span>dernière pesée <b class="' + (ok ? "c-ok" : "c-dang") + '">' + kgSigne(d) + '</b></span>');
  }
  h += '<div class="total-sub">' + sub.join("") + '</div></section>';

  h += '<div class="btns grow">' +
    '<button class="btn pri" data-act="nouvelle-pesee">' + svg("plus",16,2) + 'Peser</button>' +
    '<button class="btn" data-act="modifier-objectif">' + svg("cible",16) + 'L\'objectif</button></div>';

  /* ---- l'objectif est atteint, ou le plan est arrivé à son terme ---- */
  const atteint = c.sens === "perte" ? act <= P.cible : (c.sens === "prise" ? act >= P.cible : false);
  const fini = todayISO() >= c.fin;
  if(atteint || fini){
    h += '<div class="avert" style="border-color:var(--okF);background:var(--okF);color:var(--ok)">' +
      (atteint ? '<b>Objectif atteint.</b> ' + esc(kg(P.cible)) + ' kg, comme prévu. La suite compte autant que le chemin : ' +
        'un plan de maintien fixe les calories à ta dépense actuelle et vérifie, semaine après semaine, que le poids tient.'
              : '<b>Plan terminé.</b> Les ' + P.mois + ' mois sont écoulés. Passe en maintien pour stabiliser, ' +
        'ou fixe un nouvel objectif si tu veux continuer.') + '</div>';
    h += '<div class="btns grow">' +
      '<button class="btn pri" data-act="passer-maintien">' + svg("check",16,2.2) + 'Passer en maintien</button>' +
      '<button class="btn" data-act="modifier-objectif">Nouvel objectif</button></div>';
  }

  /* ---- le plan ---- */
  h += '<div class="sect"><h2>Le plan</h2><div class="sp"></div>' +
    '<span class="cnt mono">J' + (c.ecoule+1) + '/' + c.total + '</span></div>';
  h += '<div class="bloc"><div class="bloc-b">' +
    '<div class="lig"><div class="l">Calories du jour<div class="d">Base du plan : ' + kcal(c.base) + ' kcal</div></div>' +
      '<span class="mono" style="font-size:16px;font-weight:500">' + kcal(objectifJour(todayISO())) + '</span></div>' +
    '<div class="lig"><div class="l">Dépense estimée<div class="d">Métabolisme de repos ' + kcal(bmr()) +
      ' × ' + facteurActivite().toFixed(3).replace(".",",") + '</div></div>' +
      '<span class="mono">' + kcal(c.dep) + '</span></div>' +
    '<div class="lig"><div class="l">Rythme visé<div class="d">' +
      (c.sens === "maintien" ? "Maintien du poids" :
        esc(kg(Math.round(Math.abs(c.rythme)*1000))) + ' kg ' + (c.sens === "perte" ? "perdus" : "pris") + ' par semaine') +
      '</div></div><span class="mono">' + (c.dep === c.base ? "±0" :
        (c.dep > c.base ? "−" : "+") + kcal(Math.abs(c.dep - c.base))) + '/j</span></div>' +
    '<div class="lig"><div class="l">Fin du plan<div class="d">' + esc(frDate(c.fin, true)) + '</div></div>' +
      '<span class="mono">' + c.restants + ' j</span></div>' +
    (() => {
      /* Le report ne dépend pas de la balance : il se déclenche dès qu'une
         journée est renseignée, et s'étale sur les jours restants. */
      const d = dette();
      if(!d.n) return '<div class="lig"><div class="l">Report en cours<div class="d">' +
        'Aucune journée renseignée pour l\'instant. Dès qu\'un repas est noté, l\'écart avec la cible se reporte sur les jours restants.</div></div></div>';
      const parJour = Math.round(-d.v / c.restants);
      return '<div class="lig"><div class="l">Report en cours<div class="d">' +
        (Math.abs(d.v) < 60 ? 'Tu es dans les clous sur les ' + d.n + ' journées renseignées.'
          : (d.v > 0 ? kcal(d.v) + ' kcal de trop sur ' + d.n + ' journées, étalées sur les ' + c.restants + ' jours restants — soit ' +
              kcal(Math.abs(parJour)) + ' kcal de moins par jour. Le rattrapage est immédiat, il n\'attend pas la balance.'
                     : kcal(-d.v) + ' kcal d\'avance sur ' + d.n + ' journées, rendues sur les ' + c.restants + ' jours restants — soit ' +
              kcal(Math.abs(parJour)) + ' kcal de plus par jour.')) +
        '</div></div><span class="mono ' + (d.v > 0 ? "c-dang" : (d.v < 0 ? "c-ok" : "")) + '">' +
        (parJour > 0 ? "+" : (parJour < 0 ? "−" : "")) + kcal(Math.abs(parJour)) + '/j</span></div>';
    })() +
    '</div></div>';

  if(c.bride && c.sens === "perte"){
    h += '<div class="avert"><b>Objectif rogné.</b> Atteindre ' + esc(kg(P.cible)) + ' kg en ' + P.mois +
      ' mois demanderait ' + kcal(c.brute) + ' kcal par jour, sous le plancher de sécurité de ' + kcal(c.plancher) +
      ' kcal. Le plan s\'en tient au plancher : la perte sera plus lente que prévu. Allonge le délai pour retrouver un plan tenable.</div>';
  }else if(c.bride && c.sens === "prise"){
    h += '<div class="avert"><b>Surplus plafonné.</b> Ce délai demanderait ' + kcal(c.brute) +
      ' kcal par jour. Au-delà de ' + kcal(c.plafond) + ', le surplus part en graisse plus qu\'en muscle : le plan s\'arrête là et la prise sera plus lente. Le muscle ne se construit pas plus vite que quelques centaines de grammes par semaine.</div>';
  }else if(c.sens === "perte" && c.rythme > 1.0){
    h += '<div class="avert">Le rythme visé dépasse un kilo par semaine. C\'est possible au début, rarement tenable ensuite, et la masse musculaire en paie une partie. Un délai plus long donne un résultat qui dure.</div>';
  }else if(c.sens === "prise" && -c.rythme > 0.5){
    h += '<div class="avert">Plus de 500 g pris par semaine, c\'est surtout de la graisse. Une prise de muscle honnête tourne autour de 250 à 500 g par semaine la première année, moins ensuite.</div>';
  }
  /* Un plan alimentaire et un objectif d'entraînement peuvent se contredire :
     mieux vaut le dire que laisser croire au miracle. */
  const oe = (progs()[0] && progs()[0].obj) || DB.settings.objectif;
  if(oe === "muscle" && c.sens === "perte" && c.rythme > 0.5){
    h += '<div class="avert">L\'objectif d\'entraînement est « prendre du muscle », mais le plan alimentaire creuse un déficit marqué. Les deux se contrarient : ralentis la perte, ou passe l\'entraînement sur « transformer le gras en muscle », qui accepte un léger déficit.</div>';
  }else if((oe === "perte" || oe === "recomp") && c.sens === "prise"){
    h += '<div class="avert">L\'objectif d\'entraînement vise la perte de graisse alors que le plan alimentaire prévoit un surplus. L\'un des deux doit céder.</div>';
  }

  /* ---- la dépense réellement constatée ---- */
  const be = bilanEnergie();
  if(be && !be.insuffisant){
    const gros = Math.abs(be.ecart) > 100;
    h += '<div class="sect"><h2>Ta dépense réelle</h2></div>';
    h += '<div class="bloc"><div class="bloc-b">' +
      '<div class="lig"><div class="l">Constatée sur ' + (be.jours + 1) + ' jours<div class="d">' +
        be.n + ' journées renseignées, ' + kcal(be.moy) + ' kcal par jour en moyenne, et ce que la balance a rendu.</div></div>' +
        '<span class="mono" style="font-size:16px;font-weight:500">' + kcal(be.obs) + '</span></div>' +
      '<div class="lig"><div class="l">Estimée par la formule<div class="d">' +
        (gros ? (be.ecart > 0 ? "Tu dépenses plus que la formule ne le croit : le plan est plus sévère que nécessaire."
                              : "Tu dépenses moins que la formule ne le croit : le plan est trop généreux, la perte traîne.")
              : "L\'estimation et les faits concordent. Rien à corriger.") + '</div></div>' +
        '<span class="mono ' + (gros ? "c-att" : "c-ok") + '">' + (be.ecart > 0 ? "+" : "−") + kcal(Math.abs(be.ecart)) + '</span></div>' +
      (gros ? '<div class="lig"><div class="l">Recaler le plan<div class="d">Les calories du jour seront recalculées sur ' +
        kcal(be.obs) + ' kcal de dépense, et le plan se réajustera tout seul ensuite.</div></div>' +
        '<button class="btn pri" data-act="calibrer" data-id="' + be.corr.toFixed(4) + '">Recaler</button></div>' : "") +
      '</div></div>';
  }else if(be && be.insuffisant){
    h += '<div class="aide" style="margin-top:14px">Encore ' + Math.max(0, be.requis - be.n) +
      ' journées à renseigner sur les ' + be.jours + ' derniers jours, et Palier pourra comparer ta dépense réelle à celle qu\'il estime, puis recaler le plan.</div>';
  }

  /* ---- projection ---- */
  const pr = projection();
  if(pr){
    h += '<div class="sect"><h2>Au rythme constaté</h2></div>';
    if(pr.date){
      h += '<div class="bloc"><div class="bloc-b">' +
        '<div class="lig"><div class="l">Objectif atteint le<div class="d">' +
          'Sur ' + pr.n + ' pesées · ' + kgSigne(Math.round(pr.semaine)) + ' kg par semaine</div></div>' +
        '<span class="mono">' + esc(frDate(pr.date, true)) + '</span></div>' +
        '<div class="lig"><div class="l">Par rapport au plan<div class="d">' +
          (pr.date <= c.fin ? "En avance sur la date prévue." : "En retard sur la date prévue.") + '</div></div>' +
        '<span class="mono ' + (pr.date <= c.fin ? "c-ok" : "c-att") + '">' +
          (pr.date <= c.fin ? "−" : "+") + Math.abs(ecart(c.fin, pr.date)) + ' j</span></div></div></div>';
    }else{
      h += '<div class="aide">' + (pr.court
        ? "Moins de deux semaines entre la première et la dernière pesée : la pente mesurerait surtout l'eau et le contenu de l'estomac. La projection arrive ensuite."
        : "Le poids ne baisse pas encore sur les dernières pesées : pas de projection. Trois semaines de recul valent mieux qu'une conclusion hâtive.") + '</div>';
    }
  }

  /* ---- courbe et pesées ---- */
  const l = pesees();
  if(l.length >= 2){
    h += '<div class="graph"><div class="graph-t"><span>Courbe de poids</span><span class="sp"></span>' +
      '<span class="mono">' + l.length + ' pesées</span></div>' +
      graphLigne(l.map(x => ({ d:x.d, v:x.p/1000 })), { cible:P.cible/1000, fmt:v => v.toFixed(1).replace(".",",") }) +
      '</div>';
  }
  h += '<div class="sect"><h2>Les pesées</h2></div>';
  if(!l.length){
    h += '<div class="ops"><div class="vide"><b>Aucune pesée</b>' +
      'Le matin, à jeun, après être passé aux toilettes : c\'est la mesure la moins bruitée.</div></div>';
  }else{
    h += '<div class="ops">' + l.slice().reverse().slice(0, 40).map((x,i,arr) => {
      const suiv = arr[i+1];
      const dl = suiv ? x.p - suiv.p : 0;
      return '<button class="op" data-act="modifier-pesee" data-id="' + x.d + '">' +
        '<span class="op-ic">' + svg("balance",15,1.8) + '</span>' +
        '<span class="op-mid"><span class="op-lib">' + kg(x.p) + ' kg' +
          (x.t ? '<span class="badge">tour ' + x.t + ' cm</span>' : "") + '</span>' +
        '<span class="op-met">' + esc(cap(relDate(x.d))) + '</span></span>' +
        '<span class="op-mt ' + (dl < 0 ? "c-ok" : (dl > 0 ? "c-dang" : "c-gris")) + '">' +
          (suiv ? kgSigne(dl) : "départ") + '</span></button>';
    }).join("") + '</div>';
  }
  return h;
}

/* ============================================================
   SPORT
   L'agenda ressemble à un calendrier plutôt qu'à une liste : c'est la
   semaine qui donne le rythme, pas la séance isolée.
   ============================================================ */
function carteProgramme(p, choisi){
  return '<button class="prog' + (choisi ? " on" : "") + '" data-act="config-programme" data-id="' + p.id + '">' +
    '<div class="prog-n">' + esc(p.n) + (choisi ? '<span class="badge acc">en cours</span>' : "") + '</div>' +
    '<div class="prog-d">' + esc(p.d) + '</div>' +
    '<div class="prog-m"><span>' + esc(zoneNom(p.z)) + '</span><span>' + p.sem + ' semaines</span>' +
      '<span>' + p.par + '×/sem</span><span>' + p.min + ' min</span>' +
      '<span>' + esc(MATOS[p.mat]) + (p.cor ? " + corde" : "") + '</span><span>' + esc(p.niv) + '</span></div>' +
    '</button>';
}

function carteProgEnCours(P){
  const p = prog(P.id);
  const l = seancesDeProg(P.run);
  const faites = l.filter(x => x.fait).length;
  const sem = semaineDe(P);
  const fini = l.length && l.every(x => x.date < todayISO());
  return '<div class="bloc"><div class="bloc-h">' + esc(p ? p.n : "Programme") +
      '<div style="margin-left:auto;font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--gris)">' +
      faites + '/' + l.length + '</div></div>' +
    '<div class="bloc-b">' +
    '<div class="lig"><div class="l">' + esc(objNom(P.obj)) +
      '<div class="d">Semaine ' + sem + ' sur ' + P.sem + ' · bloc ' + (Math.floor((sem-1)/4)+1) +
      ' · ' + P.jours.map(j => JOURS_A[j]).join(", ") +
      (fini ? ' · terminé' : "") + '</div></div></div>' +
    '<div class="barre"><i style="width:' + Math.round(faites / Math.max(1, l.length) * 100) + '%"></i></div>' +
    '<div class="btns" style="margin:12px 0 0">' +
      '<button class="btn" style="flex:1" data-act="modifier-objent" data-id="' + P.run + '">' + svg("cible",15) + 'Objectif</button>' +
      '<button class="btn" style="flex:1" data-act="prolonger" data-id="' + P.run + '">' + svg("plus",15,2) + 'Prolonger</button>' +
      '<button class="btn dang" style="flex:0 0 auto" data-act="retirer-prog" data-id="' + P.run + '">' + svg("croix",15,2) + '</button>' +
    '</div></div></div>';
}

function vueSport(){
  const L = progs();
  if(!L.length){
    let h = '<section class="total"><div class="total-lbl">Programme de sport</div>' +
      '<span class="total-val num">' + PROGS.length + '<span class="u">programmes</span></span>' +
      '<div class="total-sub"><span>Le programme choisi crée toutes ses séances d\'un coup, posées sur les jours de la semaine que tu choisis.</span></div></section>';
    h += '<div class="btns grow"><button class="btn pri" data-act="choisir-programme">' + svg("halt",16) +
      'Choisir un programme</button></div>';
    h += '<div class="sect"><h2>Ce qu\'il y a dans le catalogue</h2></div><div class="ops">';
    ZONES.slice(1).forEach(([z,l]) => {
      const n = PROGS.filter(p => p.z === z);
      if(!n.length) return;
      h += '<button class="op" data-act="choisir-zone" data-id="' + z + '">' +
        '<span class="op-ic">' + svg("halt",15,1.8) + '</span>' +
        '<span class="op-mid"><span class="op-lib">' + esc(l) + '</span>' +
        '<span class="op-met">' + n.map(p => MATOS[p.mat]).filter((v,i,a) => a.indexOf(v) === i).join(" · ") + '</span></span>' +
        '<span class="op-mt">' + n.length + '</span></button>';
    });
    h += '</div>';
    h += '<div class="aide" style="text-align:center;margin-top:14px">Plusieurs programmes peuvent tourner en même temps : de la musculation trois fois par semaine, du cardio le samedi.</div>';
    return h;
  }

  const l = seancesTri();
  const faites = seancesFaites();
  const ass = assiduite();
  const t = todayISO();

  let h = '<section class="total">' +
    '<div class="total-lbl">' + (L.length > 1 ? L.length + ' programmes en cours' : esc((prog(L[0].id)||{}).n || "Programme")) + '</div>' +
    '<span class="total-val num">' + faites + '<span class="u">/ ' + l.length + ' séances</span></span>' +
    '<div class="bud"><div class="bud-l"><span>' +
      (L.length > 1 ? l.filter(s => s.date >= t).length + ' séances à venir' : 'Semaine ' + semaineDe(L[0]) + ' sur ' + L[0].sem) + '</span>' +
      (ass != null ? '<span class="r">assiduité ' + ass + ' %</span>' : "") + '</div>' +
      '<div class="bud-b"><i class="acc" style="width:' + Math.round(faites/Math.max(1,l.length)*100) + '%"></i></div></div>';
  const sub = [];
  const jsem = [];
  L.forEach(P => P.jours.forEach(j => { if(jsem.indexOf(j) === -1) jsem.push(j); }));
  sub.push('<span><b>' + jsem.sort((a,b) => ((a+6)%7) - ((b+6)%7)).map(j => JOURS_A[j]).join(", ") + '</b></span>');
  if(L.length === 1) sub.push('<span><b>' + esc(objNom(L[0].obj)) + '</b></span>');
  if(nbRemplacements()) sub.push('<span><b>' + nbRemplacements() + '</b> exercice' + (nbRemplacements()>1?"s":"") +
    ' remplacé' + (nbRemplacements()>1?"s":"") + '</span>');
  h += '<div class="total-sub">' + sub.join("") + '</div></section>';

  const prochaine = prochaineSeance();
  if(prochaine){
    h += '<div class="btns grow"><button class="btn pri" data-act="ouvrir-seance" data-id="' + prochaine.id + '">' +
      svg("halt",16) + (prochaine.date === t ? "La séance du jour" : "Prochaine séance") + '</button></div>';
  }

  /* ---- les programmes en cours ---- */
  h += '<div class="sect"><h2>' + (L.length > 1 ? "Tes programmes" : "Ton programme") + '</h2></div>';
  h += L.map(carteProgEnCours).join("");
  h += '<div class="btns grow">' +
    '<button class="btn" data-act="ajouter-programme">' + svg("plus",16,2) + 'Ajouter un programme</button>' +
    '<button class="btn" data-act="ouvrir-guide">' + svg("info",16) + 'Guide</button></div>';
  h += '<div class="aide" style="text-align:center">Un deuxième programme se pose sur les jours restés libres : du cardio le samedi à côté de la musculation, par exemple. Les séances se rangent ensemble dans l\'agenda.</div>';

  /* ---- l'agenda, par semaine de calendrier ---- */
  const parSem = {};
  l.forEach(s => { const k = lundiDe(s.date); (parSem[k] = parSem[k] || []).push(s); });
  const sems = Object.keys(parSem).sort();
  const lundiJour = lundiDe(t);
  const passees = sems.filter(w => w < lundiJour);
  const visibles = state.passe ? sems : sems.filter(w => w >= lundiJour);

  h += '<div class="sect"><h2>L\'agenda</h2><div class="sp"></div>' +
    (passees.length ? '<button class="lien" data-act="basculer-passe">' +
      (state.passe ? "Masquer le passé" : passees.length + " semaines passées") + '</button>' : "") + '</div>';

  h += '<div class="ops">';
  if(!visibles.length){
    h += '<div class="vide"><b>Plus rien de prévu</b>Prolonge un programme, ou choisis-en un nouveau.</div>';
  }
  visibles.forEach(w => {
    const g = parSem[w].slice().sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : a.mod - b.mod));
    const now = w === lundiJour;
    h += '<div class="sem' + (now ? " now" : "") + '"><span>' + (now ? "Cette semaine" : "Semaine du " + frDate(w)) + '</span>' +
      '<span class="sp"></span><span>' + esc(frDate(w)) + ' – ' + esc(frDate(plusJours(w, 6))) + '</span>' +
      '<span>' + g.filter(s => s.fait).length + '/' + g.length + '</span></div>';
    g.forEach(s => { h += carteSeance(s); });
  });
  h += '</div>';

  const ad = adaptations();
  if(ad.notes.length){
    h += '<div class="sect"><h2>Adapté à ton profil</h2></div>' +
      '<div class="bloc"><div class="bloc-b"><ul class="conseils" style="margin:0">' +
      ad.notes.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' +
      '<div class="aide">Change l\'âge, la taille, le niveau ou l\'activité dans les réglages : les séances à venir sont recalculées aussitôt.</div>' +
      '</div></div>';
  }
  h += '<div class="btns"><button class="btn" data-act="changer-programme">' + svg("echange",16) +
    'Repartir de zéro</button></div>';
  return h;
}

/* ============================================================
   BILAN
   ============================================================ */
const PERIODES = [["30j","30 jours"],["90j","3 mois"],["tout","Tout"]];
function debutPeriode(f){
  if(f === "tout") return "";
  if(f === "30j") return plusJours(todayISO(), -30);
  return plusJours(todayISO(), -90);
}
function vueBilan(){
  const per = state.bPeriode;
  const dep = debutPeriode(per);
  const c = planCalc();
  const l = pesees().filter(x => !dep || x.d >= dep);
  const jrs = joursAll().filter(j => (!dep || j.id >= dep) && j.repas && j.repas.length)
    .sort((a,b) => a.id < b.id ? -1 : 1);

  let h = '<section class="total" style="padding:22px 0 14px">' +
    '<div class="total-lbl">Bilan</div>';
  const perdu = c ? (c.P.depart - poidsActuel()) : (l.length > 1 ? l[0].p - l[l.length-1].p : 0);
  h += '<span class="total-val num ' + (perdu > 0 ? "c-ok" : "") + '">' + kgSigne(-perdu) +
    '<span class="u">kg</span></span>' +
    '<div class="total-sub"><span>depuis le début du plan</span></div></section>';

  h += '<div class="chips" style="margin-top:14px">' + PERIODES.map(([k,lb]) =>
    '<button class="chip ' + (per === k ? "on" : "") + '" data-act="b-periode" data-id="' + k + '">' + lb + '</button>').join("") + '</div>';

  const moy = jrs.length ? Math.round(jrs.reduce((s,j) => s + kcalJour(j.id), 0) / jrs.length) : 0;
  const pr = projection();
  const ass = assiduite();
  const sf = seancesAll().filter(s => s.fait && (!dep || s.date >= dep));
  const libres = joursAll().filter(j => !dep || j.id >= dep)
    .reduce((t,j) => t + (j.sport||[]).reduce((u,a) => u + (a.k||0), 0), 0);
  const brulees = sf.reduce((s,x) => s + (x.k||0), 0) + libres;

  h += '<div class="stats">' +
    '<div class="stat"><div class="v">' + (moy ? kcal(moy) : "—") + '</div><div class="l">kcal par jour en moyenne</div></div>' +
    '<div class="stat"><div class="v">' + jrs.length + '</div><div class="l">journées renseignées</div></div>' +
    '<div class="stat"><div class="v">' + sf.length + '</div><div class="l">séances terminées</div></div>' +
    '<div class="stat"><div class="v">' + (ass != null ? ass + " %" : "—") + '</div><div class="l">assiduité au programme</div></div>' +
    '<div class="stat"><div class="v">' + (pr && pr.semaine ? kg(Math.round(pr.semaine)) : "—") + '</div><div class="l">kg par semaine constatés</div></div>' +
    '<div class="stat"><div class="v">' + (brulees ? kcal(brulees) : "—") + '</div><div class="l">kcal dépensées au sport</div></div>' +
    '</div>';

  if(l.length >= 2){
    h += '<div class="graph"><div class="graph-t"><span>Poids</span><span class="sp"></span>' +
      '<span class="mono">' + kg(l[0].p) + ' → ' + kg(l[l.length-1].p) + ' kg</span></div>' +
      graphLigne(l.map(x => ({ d:x.d, v:x.p/1000 })), { cible:c ? c.P.cible/1000 : null, fmt:v => v.toFixed(1).replace(".",",") }) +
      '</div>';
  }

  /* Les calories jour après jour, sur les trente derniers jours du filtre. */
  const fin = todayISO();
  const nbJ = per === "30j" ? 30 : (per === "90j" ? 45 : 45);
  const barres = [];
  for(let i = nbJ - 1; i >= 0; i--){
    const d = plusJours(fin, -i);
    barres.push({ d, v:kcalJour(d), c:c ? c.base : 0 });
  }
  if(barres.some(b => b.v)){
    h += '<div class="graph"><div class="graph-t"><span>Calories par jour</span><span class="sp"></span>' +
      (c ? '<span class="mono">cible ' + kcal(c.base) + '</span>' : "") + '</div>' +
      graphBarres(barres, c ? c.base : 0) +
      '<div class="graph-t" style="margin:6px 0 0"><span class="mono">' + esc(frDate(barres[0].d)) +
      '</span><span class="sp"></span><span class="mono">' + esc(frDate(barres[barres.length-1].d)) + '</span></div></div>';
  }

  /* L'assiduité, semaine par semaine. */
  if(progs().length){
    const parSem = {};
    seancesRun().filter(s => s.date <= fin).forEach(s => {
      const g = parSem[s.sem] = parSem[s.sem] || { t:0, f:0 };
      g.t++; if(s.fait) g.f++;
    });
    const ks = Object.keys(parSem).map(Number).sort((a,b) => a-b).slice(-12);
    if(ks.length){
      h += '<div class="sect"><h2>Semaine par semaine</h2></div><div class="ops">';
      ks.reverse().forEach(w => {
        const g = parSem[w];
        h += '<div class="op"><span class="op-ic">' + svg("halt",15,1.8) + '</span>' +
          '<span class="op-mid"><span class="op-lib">Semaine ' + w + '</span>' +
          '<span class="barre" style="margin-top:6px"><i style="width:' + Math.round(g.f/g.t*100) + '%"></i></span></span>' +
          '<span class="op-mt ' + (g.f === g.t ? "c-ok" : "") + '">' + g.f + '/' + g.t + '</span></div>';
      });
      h += '</div>';
    }
  }

  if(!l.length && !jrs.length){
    h += '<div class="ops"><div class="vide"><b>Rien à mesurer encore</b>' +
      'Une pesée et quelques repas notés, et les courbes commencent à dire quelque chose.</div></div>';
  }
  return h;
}

function ko(o){
  if(o == null) return "?";
  if(o > 1048576) return (o/1048576).toFixed(1) + " Mo";
  if(o > 1024) return Math.round(o/1024) + " Ko";
  return o + " o";
}

function fmtLigne(l, circuit){
  const p = [];
  if(l.t && l.s <= 1) p.push(duree(l.t));
  else if(l.t) p.push(l.s + " × " + l.t + " s");
  else p.push(l.s + " × " + l.x);
  /* « repos 100 s » ne dit pas de quoi il s'agit : on le précise. */
  if(l.r) p.push(l.r + " s " + (circuit ? "avant le suivant" : "entre séries"));
  return p.join(" · ");
}

function totalPanier(){ return state.panier.reduce((t,l) => t + Math.round(l.k * l.q), 0); }
function ligneQte(q){ return q === 0.5 ? "½" : (q % 1 ? String(q).replace(".",",") + " ×" : q + " ×"); }

function totalPanier(){ return state.panier.reduce((t,l) => t + Math.round(l.k * l.q), 0); }

/* La liste seule, pour pouvoir la remplacer sans toucher au reste de la
   page : redessiner tout le panneau à chaque lettre tapée faisait sauter le
   défilement et fermait le clavier. */
function listeAliments(){
  const q = state.q || "";
  const trouves = chercherAliments(q);
  const cat = state.fCat;
  let liste, titre;
  if(trouves){ liste = trouves; titre = trouves.length + " résultat" + (trouves.length > 1 ? "s" : ""); }
  else if(cat === "types"){
    /* Les repas enregistrés : on mange le même petit-déjeuner trois cents fois
       par an, il n'y a aucune raison de le ressaisir trois cents fois. */
    const l = (DB.repasTypes || []).slice().sort((a,b) => (b.nb||0) - (a.nb||0) || (b.ts||0) - (a.ts||0));
    return { titre:"Mes repas",
      html: l.length ? l.map(r =>
        '<div class="alim"><button class="alim-mid" style="text-align:left" data-act="type-add" data-id="' + esc(r.id) + '">' +
        '<span class="alim-n">' + esc(r.n) + '</span>' +
        '<span class="alim-p">' + r.items.length + ' élément' + (r.items.length > 1 ? "s" : "") +
        (r.nb ? ' · repris ' + r.nb + ' fois' : "") + '</span></button>' +
        '<span class="alim-k">' + kcal(r.k) + ' kcal</span>' +
        '<button class="alim-add" data-act="type-add" data-id="' + esc(r.id) + '" aria-label="Ajouter">' + svg("plus",15,2.2) + '</button>' +
        '<button class="alim-add" style="color:var(--gris2)" data-act="type-suppr" data-id="' + esc(r.id) + '" aria-label="Supprimer">' +
        svg("croix",14,2) + '</button></div>').join("")
        : '<div class="vide"><b>Aucun repas enregistré</b>Compose une assiette dans le panier, puis touche « Enregistrer ce repas ».</div>' };
  }
  else if(cat != null){ liste = CATALOGUE.filter(a => a.cat === ALIMENTS[cat][0]); titre = ALIMENTS[cat][0]; }
  else{
    /* Sans recherche ni catégorie : ce qu'on mange d'habitude, puisque c'est
       ce qu'on mangera encore demain. */
    const f = favoris();
    liste = f.map((x,i) => ({ id:"f"+i, n:x.n, k:x.k, p:"noté " + x.nb + " fois", cat:"Habitudes" }));
    titre = liste.length ? "Tes habitudes" : "Par où commencer";
  }
  let html;
  if(!liste.length){
    html = '<div class="vide"><b>' + (trouves ? "Rien trouvé" : "Pas encore d'habitudes") + '</b>' +
      (trouves ? "Essaie un mot plus court — « tortilla », « salade », « huile » — ou compose ton plat à partir des ingrédients."
               : "Choisis une catégorie ci-dessus. Les plats que tu notes le plus souvent apparaîtront ici.") + '</div>';
  }else{
    html = liste.map(a =>
      '<button class="alim" data-act="a-add" data-id="' + esc(a.id) + '" data-n="' + esc(a.n) +
      '" data-k="' + a.k + '" data-p="' + esc(a.p || "") + '">' +
      '<span class="alim-mid"><span class="alim-n">' + esc(a.n) + '</span>' +
      '<span class="alim-p">' + esc(a.p || "") + '</span></span>' +
      '<span class="alim-k">' + kcal(a.k) + ' kcal</span>' +
      '<span class="alim-add">' + svg("plus",15,2.2) + '</span></button>').join("");
  }
  return { titre, html };
}

/* Le panier : ce qu'on vient de manger, en portions. Une portion et demie de

function vueSheet(sh){

  h += '<p style="font-size:14.5px;line-height:1.6;color:var(--gris);margin:14px 0 0">' + esc(e.d) + '</p>';

  const ph = photos(e);
  if(ph) h += '<div class="sect"><h2>En photo</h2></div>' + ph;
  /* Le jeu de données ne fournit pas de vidéos : le bouton ouvre une recherche
     dans le navigateur, avec le nom de l'exercice déjà écrit. C'est moins
     élégant qu'une vidéo intégrée, mais au moins ce n'est pas un mensonge. */
  h += '<div class="btns grow" style="margin-top:' + (ph ? "4px" : "14px") + '">' +
    '<a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=' +
    encodeURIComponent(e.n + " exercice technique") + '">' + svg("chev",16) + 'Voir une vidéo</a></div>';

  const bd = planche(e.fig);
  if(bd){
    h += '<div class="sect"><h2>Le mouvement, pas à pas</h2></div>' + bd;
  }

  if(l){
    h += '<div class="repere">' +
      (l.t && l.s <= 1 ? '<span>Durée <b>' + esc(duree(l.t)) + '</b></span>'
        : '<span>Séries <b>' + l.s + '</b></span><span>' + (l.t ? 'Temps <b>' + l.t + ' s</b>' : 'Répétitions <b>' + l.x + '</b>') + '</span>') +
      (l.r ? '<span>Repos entre séries <b>' + l.r + ' s</b></span>' : "") +
      '<span>Matériel <b>' + esc(MATOS[e.mat]) + '</b></span></div>';
  }else{
    h += '<div class="repere"><span>Matériel <b>' + esc(MATOS[e.mat]) + '</b></span></div>';
  }

  if(l && l.xmin){
    const o = objEnt((s && s.obj) || DB.settings.objectif);
    h += '<div class="sect"><h2>Comment doser</h2></div>' +
      '<div class="bloc"><div class="bloc-b">' +
      '<div class="lig"><div class="l">Fourchette visée<div class="d">Cette semaine : ' + l.s + ' séries de ' + l.x +
        '. La fourchette de l\'exercice va de ' + l.xmin + ' à ' + l.xmax + ' répétitions.</div></div>' +
        '<span class="mono" style="font-size:15px">' + l.xmin + '–' + l.xmax + '</span></div>' +
      '<div class="lig"><div class="l">Le repos<div class="d">Les ' + (l.r || 60) + ' secondes indiquées séparent deux séries du même exercice. Entre deux exercices différents, compte une à deux minutes de plus.</div></div></div>' +
      '<div class="lig"><div class="l">Le bon effort<div class="d">La dernière répétition doit être difficile mais propre. S\'il t\'en reste plus de deux ou trois en réserve, c\'est trop facile ; si la technique se dégrade, c\'est trop dur.</div></div></div>' +
      '<div class="lig"><div class="l">Quand augmenter<div class="d">Le jour où tu passes ' + l.xmax +
        ' répétitions propres sur toutes les séries, ce n\'est plus le nombre qu\'il faut augmenter : ajoute de la charge, ralentis la descente, ou remplace par une variante plus difficile.</div></div></div>' +
      '<div class="lig"><div class="l">' + esc(o.n) + '<div class="d">' + esc(o.c) + '</div></div></div>' +
      '</div></div>';
  }
  if(chargeable(eid)){
    const mem = derniereCharge(eid);
    h += '<div class="sect"><h2>Ta charge</h2>' + (s && sh.i != null ?
      '<div class="sp"></div><button class="lien" data-act="ouvrir-charge" data-id="' + s.id + '" data-i="' + sh.i + '">Noter</button>' : "") + '</div>';
    h += '<div class="bloc"><div class="bloc-b">';
    if(mem){
      h += '<div class="lig"><div class="l">La dernière fois<div class="d">' + esc(frDate(mem.d, true)) +
        (mem.x ? ' · ' + mem.x + ' répétitions' : "") + '</div></div>' +
        '<span class="mono" style="font-size:16px;font-weight:500">' + esc(fmtKg(mem.kg)) + '</span></div>';
      const hist = (mem.hist || []).slice(-6).reverse();
      if(hist.length > 1){
        h += '<div class="lig" style="display:block"><div class="l">L\'historique</div>' +
          '<div class="ops" style="margin-top:4px">' + hist.map(x =>
            '<div class="op" style="padding:7px 0"><span class="op-mid"><span class="op-met">' + esc(frDate(x.d, true)) + '</span></span>' +
            '<span class="op-mt">' + esc(fmtKg(x.kg)) + (x.x ? ' × ' + x.x : "") + '</span></div>').join("") + '</div></div>';
      }
    }else{
      h += '<div class="lig"><div class="l">Aucune charge notée<div class="d">Note ce que tu soulèves : c\'est le seul moyen de savoir, la fois suivante, s\'il faut monter.</div></div></div>';
    }
    h += '<div class="lig"><div class="l">Quand monter<div class="d">Quand le haut de la fourchette passe proprement sur toutes les séries, ajoute la plus petite charge disponible et redescends au bas de la fourchette. Sans matériel, alourdis autrement : un sac à dos chargé, une variante plus difficile, une descente plus lente.</div></div></div>';
    h += '</div></div>';
  }
  h += '<div class="sect"><h2>Les conseils</h2></div><ul class="conseils">' +
    (e.c||[]).map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>';

  h += '<div class="btns grow" style="margin-top:20px">' +
    '<button class="btn" data-act="ouvrir-remplacer" data-id="' + sh.e + '" data-sid="' + (sh.sid||"") + '" data-i="' + (sh.i != null ? sh.i : "") + '">' +
      svg("echange",16) + 'Remplacer cet exercice</button></div>';
  h += '<div class="aide" style="text-align:center">Le remplacement vaut pour toutes les séances où l\'exercice apparaît, celles à venir comme celles déjà passées.</div>';
  h += '</div></div>';
  return h;
}

function sheetRemplacer(sh){
  const orig = EXOS[sh.e];
  if(!orig) return "";
  const actuel = resoudre(sh.e);
  const alts = alternatives(sh.e);
  let h = '<div class="sheet">' + hautPanneau("Remplacer", "retour-exo");
  h += '<div class="sheet-in">';
  h += '<section class="total" style="padding:20px 0 14px">' +
    '<div class="total-lbl">À la place de</div>' +
    '<span class="total-val num" style="font-size:clamp(24px,7vw,30px)">' + esc(orig.n) + '</span>' +
    '<div class="total-sub"><span>' + esc(GROUPES[orig.g]) + '</span><span>' + esc(PATS[orig.pat]) + '</span>' +
      '<span>' + esc(MATOS[DB.settings.matos||0]) + '</span></div></section>';
  h += '<div class="aide" style="margin-top:12px">Seuls les exercices travaillant les mêmes muscles sont proposés, et seulement ceux que ton matériel permet. Le matériel se règle dans les réglages.</div>';

  if(actuel !== sh.e){
    h += '<div class="btns grow" style="margin-top:14px"><button class="btn" data-act="retablir-exo" data-id="' + sh.e + '">' +
      svg("echange",16) + 'Rétablir ' + esc(orig.n) + '</button></div>';
  }

  h += '<div class="sect"><h2>Les remplaçants possibles</h2><div class="sp"></div><span class="cnt">' + alts.length + '</span></div>';
  h += '<div class="ops">';
  if(!alts.length){
    h += '<div class="vide"><b>Aucun remplaçant</b>Élargis le matériel disponible dans les réglages pour ouvrir le choix.</div>';
  }
  alts.forEach(k => {
    const x = EXOS[k];
    const meme = x.pat === orig.pat;
    h += '<div class="exo' + (k === actuel ? " done" : "") + '">' +
      '<button class="exo-f" data-act="appliquer-remplacement" data-id="' + sh.e + '" data-par="' + k + '" aria-label="' + esc(x.n) + '">' + figSVG(x.fig) + '</button>' +
      '<button class="exo-mid" style="text-align:left" data-act="appliquer-remplacement" data-id="' + sh.e + '" data-par="' + k + '">' +
        '<span class="exo-n">' + esc(x.n) + (k === actuel ? '<span class="badge acc">en place</span>' : "") + '</span>' +
        '<span class="exo-s">' + esc(GROUPES[x.g]) + ' · ' + esc(meme ? PATS[x.pat] : "muscles proches") +
          (x.mat ? ' · ' + esc(MATOS[x.mat]) : "") + '</span></button>' +
      '<span class="sea-go">' + svg("chev",16) + '</span></div>';
  });
  h += '</div></div></div>';
  return h;
}

function grandChamp(id, val, unite, ph){

function boiteBoutons(valider, act, sup){
  return '<div class="btns" style="margin:20px 0 0">' +
    (sup ? '<button class="btn dang" style="flex:0 0 auto" data-act="' + sup.act + '" data-id="' + esc(sup.id) + '">' + esc(sup.l) + '</button>'
         : '<button class="btn" style="flex:0 0 auto" data-act="fermer-modal">Renoncer</button>') +
    '<button class="btn pri" style="flex:1" data-act="' + act + '">' + valider + '</button></div>';
}
/* Les repas déjà saisis servent de raccourcis : on mange rarement des choses
   entièrement nouvelles, et retaper « petit-déjeuner » chaque matin serait
   une punition. */
function favoris(){
  const m = new Map();
  joursAll().forEach(j => (j.repas||[]).forEach(r => {
    const k = (r.n||"").trim().toLowerCase();
    if(!k) return;
    const g = m.get(k) || { n:r.n, k:r.k, nb:0, t:0 };
    g.nb++;
    if((r.t||0) > g.t){ g.t = r.t; g.k = r.k; }
    m.set(k, g);
  }));
  return [...m.values()].sort((a,b) => b.nb - a.nb || b.t - a.t).slice(0, 6);
}

        '<button data-act="charge-pas" data-d="0.5" aria-label="Plus 0,5">+0,5</button>' +

      '<div class="raccourcis">' + [5,8,10,12,15,20,25,30,40,50].map(x =>
        '<button data-act="charge-val" data-d="' + x + '">' + x + ' kg</button>').join("") + '</div>' +
      '<div class="aide">Pour un élastique, note le repère que tu utilises plutôt qu\'un poids : l\'important est de retrouver le même la fois suivante. ' +
      'Pour un exercice au poids du corps, note le lest ajouté.</div>' +
      '<div class="btns" style="margin:18px 0 0">' +
        (l && l.kg != null ? '<button class="btn dang" style="flex:0 0 auto" data-act="charge-retirer">Retirer</button>'
                           : '<button class="btn" style="flex:0 0 auto" data-act="fermer-modal">Renoncer</button>') +
        '<button class="btn pri" style="flex:1" data-act="charge-ok">Enregistrer</button></div>';

  if(m.type === "typeRepas"){

      '<div class="aide">' + state.panier.length + ' élément' + (state.panier.length > 1 ? "s" : "") + ' · ' + kcal(totalPanier()) + ' kcal — ' +
      esc(state.panier.map(l => l.n + (l.q !== 1 ? " (" + ligneQte(l.q) + ")" : "")).join(", ")) + '</div>' +
      boiteBoutons("Enregistrer", "type-creer");

  if(m.type === "activiteSport"){

      '<div class="champ"><label>Durée</label><div class="chips">' +
        [10,15,20,30,45,60,90,120].map(x => '<button class="chip ' + (min === x ? "on" : "") +
          '" data-act="act-duree" data-id="' + x + '">' + (x >= 60 ? (x/60) + " h" : x + " min") + '</button>').join("") +
      '</div></div>' +
      '<div class="champ"><label>L\'activité</label>' +
        '<input type="text" id="m-aq" autocomplete="off" placeholder="Chercher…" value="' + esc(m.q || "") + '"></div>' +
      '<div class="ops" style="max-height:44vh;overflow:auto">' +
      (() => {
        const q = (m.q || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const l = ACTIVITES_SPORT.filter(a => !q ||
          a[0].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").indexOf(q) !== -1);
        if(!l.length) return '<div class="vide">Rien trouvé sous ce nom.</div>';
        return l.map(a => '<button class="op" data-act="act-ok" data-id="' + esc(a[0]) + '" data-met="' + a[1] + '">' +

      })() +

  if(m.type === "confirm"){

      '<button class="btn ' + (m.dang ? "dang" : "pri") + '" style="flex:1" data-act="' + m.ok + '" data-id="' + esc(m.id||"") + '">' +
      esc(m.valider) + '</button></div>';

  if(m.type === "effacer"){

      '<div class="sous">Journées, pesées, séances, objectif et programme. Rien ne pourra être récupéré.</div>' +
